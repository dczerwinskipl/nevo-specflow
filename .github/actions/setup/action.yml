name: Setup
description: Enable Corepack, set up Node from .nvmrc, install pnpm deps from the frozen lockfile, restore the Turbo cache. Run actions/checkout (with fetch-depth 0) before this.

runs:
  using: composite
  steps:
    # Git fixtures commit constantly; detached auto-maintenance after a commit takes
    # .git/objects/maintenance.lock and keeps writing under .git while tests snapshot or
    # delete the repository. The Engine strips GIT_* variables, so this has to be config.
    - name: Disable Git auto-maintenance
      shell: bash
      run: |
        git config --global maintenance.auto false
        git config --global gc.auto 0

    - name: Enable Corepack
      shell: bash
      run: corepack enable

    - name: Setup Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Install
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Restore Turborepo cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .turbo
        key: turbo-${{ runner.os }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}-
