name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "release/v*"

# Superseded PR runs are cancelled; main / release pushes always run to completion.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # On a PR, scope package tasks to what changed since the base; elsewhere run everything.
  # A shallow checkout would make every package look affected — checkout uses fetch-depth: 0.
  TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
  TURBO_SCM_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}
  AFFECTED: ${{ github.event_name == 'pull_request' && '--affected' || '' }}

jobs:
  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  format-probe:
    name: format probe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Show exact Prettier diff
        shell: bash
        run: |
          pnpm exec prettier --write tools/release/test/app/create-release.test.ts
          git diff -- tools/release/test/app/create-release.test.ts
          exit 1

  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup

      # The same canonical script contributors run locally: format:check, lint,
      # docs validation/index freshness, and the version.json transition gate.
      - name: Quality gate
        run: pnpm check:quality

      - name: Resolved version
        run: pnpm version:print

      # Package-scoped — affected on PRs, full on main / release.
      - name: Affected packages
        run: pnpm exec turbo run typecheck test build ${{ env.AFFECTED }} --dry=text
      - name: Typecheck
        run: pnpm exec turbo run typecheck ${{ env.AFFECTED }}

  test-plan:
    name: plan tests
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_tests: ${{ steps.plan.outputs.has_tests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup

      # Resolve the same Turbo task graph used for execution, then fan only package
      # test tasks out into independent GitHub jobs. On PRs, --affected selects changed
      # workspaces plus downstream dependents from the declared workspace graph; main /
      # release exercise every package test task.
      - name: Resolve package tests
        id: plan
        shell: bash
        run: |
          pnpm exec turbo run test ${{ env.AFFECTED }} --dry=json > .turbo-test-plan.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const plan = JSON.parse(fs.readFileSync('.turbo-test-plan.json', 'utf8'));
          const packages = [
            ...new Set(
              plan.tasks
                .filter(
                  (task) =>
                    task.task === 'test' &&
                    typeof task.taskId === 'string' &&
                    !task.taskId.startsWith('//#'),
                )
                .map((task) => task.taskId.slice(0, task.taskId.lastIndexOf('#'))),
            ),
          ].sort();

          const tests = packages.map((packageName) => ({
            package: packageName,
            label: packageName.startsWith('nevo-repo-')
              ? `tool/${packageName.slice('nevo-repo-'.length)}`
              : packageName,
          }));

          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `matrix=${JSON.stringify({ include: tests })}\nhas_tests=${tests.length > 0}\n`,
          );
          NODE

  package-test:
    name: test (${{ matrix.label }})
    needs: test-plan
    if: needs.test-plan.outputs.has_tests == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.test-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Test ${{ matrix.package }}
        env:
          PACKAGE: ${{ matrix.package }}
        run: pnpm exec turbo run test --filter="$PACKAGE"

  # Aggregate the independently-running package tests into one stable required check.
  verify-tests:
    name: verify tests
    needs:
      - test-plan
      - package-test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify tests
        env:
          PLAN_RESULT: ${{ needs.test-plan.result }}
          PACKAGE_RESULT: ${{ needs.package-test.result }}
          HAS_TESTS: ${{ needs.test-plan.outputs.has_tests }}
        shell: bash
        run: |
          if [ "$PLAN_RESULT" != "success" ]; then
            echo "Test planning failed: $PLAN_RESULT"
            exit 1
          fi

          if [ "$HAS_TESTS" = "true" ] && [ "$PACKAGE_RESULT" != "success" ]; then
            echo "At least one package test job failed: $PACKAGE_RESULT"
            exit 1
          fi

          echo "Package tests passed (or no package test task was affected)."

  packaged-product:
    name: product smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Pack and smoke installed product
        run: pnpm --filter @nevo/specflow test:packaged

  verify-product-smoke:
    name: product smoke
    needs: packaged-product
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify product smoke matrix
        env:
          RESULT: ${{ needs.packaged-product.result }}
        shell: bash
        run: |
          if [ "$RESULT" != "success" ]; then
            echo "At least one packaged-product smoke job failed: $RESULT"
            exit 1
          fi
          echo "Packaged-product smoke passed on Linux, Windows and macOS."

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Build
        run: pnpm exec turbo run build ${{ env.AFFECTED }}
