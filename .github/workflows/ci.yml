name: CI

on:
  workflow_dispatch:
  # Nightly comprehensive integration suite on the default branch.
  schedule:
    - cron: "17 2 * * *"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches:
      - main
      - "release/v*"

# Superseded PR runs are cancelled; main / release pushes always run to completion.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # On a PR, scope package tasks to what changed since the base; elsewhere run everything.
  # A shallow checkout would make every package look affected — checkout uses fetch-depth: 0.
  TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
  TURBO_SCM_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}
  AFFECTED: ${{ github.event_name == 'pull_request' && '--affected' || '' }}

jobs:
  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  quality:
    name: quality
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup

      # The same canonical script contributors run locally: format:check, lint,
      # docs validation/index freshness, and the version.json transition gate.
      - name: Quality gate
        run: pnpm check:quality

      - name: Resolved version
        run: pnpm version:print

      # Package-scoped — affected on PRs, full on main / release.
      - name: Affected packages
        run: pnpm exec turbo run typecheck test build ${{ env.AFFECTED }} --dry=text
      - name: Typecheck
        run: pnpm exec turbo run typecheck ${{ env.AFFECTED }}

  test-plan:
    name: plan tests
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_tests: ${{ steps.plan.outputs.has_tests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup

      - name: Storybook scope self-test
        run: node tools/ci-storybook-scope.mjs --self-test

      # Resolve the Turbo task graph and fan out independent package jobs.
      # PRs select affected workspaces, then defer known process/browser-heavy packages;
      # main, release, scheduled and manual runs execute the full package suite.
      - name: Resolve package tests
        id: plan
        shell: bash
        run: |
          pnpm exec turbo run test ${{ env.AFFECTED }} --dry=json > .turbo-test-plan.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';

          const plan = JSON.parse(fs.readFileSync('.turbo-test-plan.json', 'utf8'));
          const packages = [
            ...new Set(
              plan.tasks
                .filter(
                  (task) =>
                    task.task === 'test' &&
                    typeof task.taskId === 'string' &&
                    !task.taskId.startsWith('//#'),
                )
                .map((task) => task.taskId.slice(0, task.taskId.lastIndexOf('#'))),
            ),
          ].sort();

          // These packages run subprocess/transport/browser integration tests.
          // Keep them for main/nightly/manual runs, not the PR feedback loop.
          // Storybook is scoped by changed path instead (tools/ci-storybook-scope.mjs):
          // nevo-ui => full corpus, specflow-ui => its stories, otherwise nothing extra.
          const isPr = process.env.GITHUB_EVENT_NAME === 'pull_request';
          const storybook = 'nevo-repo-storybook';
          const deferredOnPr = new Set(['@nevo/specflow', '@nevo/specflow-runtime', storybook]);
          const selectedPackages = isPr
            ? packages.filter((packageName) => !deferredOnPr.has(packageName))
            : packages;

          const toTest = (packageName, filters = []) => ({
            package: packageName,
            label: packageName.startsWith('nevo-repo-')
              ? `tool/${packageName.slice('nevo-repo-'.length)}`
              : packageName,
            // Space-separated vitest path filters; empty = the whole package suite.
            filters: filters.join(' '),
          });
          const tests = selectedPackages.map((packageName) => toTest(packageName));

          if (isPr) {
            const scope = JSON.parse(
              execFileSync(
                'node',
                [
                  'tools/ci-storybook-scope.mjs',
                  process.env.TURBO_SCM_BASE,
                  process.env.TURBO_SCM_HEAD,
                ],
                { encoding: 'utf8' },
              ),
            );
            console.log(`Storybook PR scope: ${JSON.stringify(scope)}`);
            if (scope.mode !== 'none') {
              tests.push(toTest(storybook, scope.filters));
            }
          }

          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `matrix=${JSON.stringify({ include: tests })}\nhas_tests=${tests.length > 0}\n`,
          );
          NODE

  package-test:
    name: test (${{ matrix.label }})
    needs: test-plan
    if: needs.test-plan.outputs.has_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.test-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Install Playwright Chromium
        if: matrix.package == 'nevo-figma-import' || matrix.package == 'nevo-repo-storybook'
        run: pnpm --filter "${{ matrix.package }}" exec playwright install --with-deps chromium
      - name: Engine unit tests (PR only)
        if: github.event_name == 'pull_request' && matrix.package == '@nevo/specflow-engine'
        run: |
          pnpm turbo run build --filter=@nevo/specflow-engine^...
          pnpm --filter @nevo/specflow-engine test:unit
      # PR: all stories of a changed design-system / SpecFlow UI package, or the
      # directly changed stories (scope planned by tools/ci-storybook-scope.mjs).
      - name: Test nevo-repo-storybook (PR scope)
        if: github.event_name == 'pull_request' && matrix.package == 'nevo-repo-storybook'
        env:
          STORYBOOK_FILTERS: ${{ matrix.filters }}
        shell: bash
        # Space-separated vitest path filters; empty runs the whole corpus.
        run: |
          read -r -a filters <<< "$STORYBOOK_FILTERS"
          # turbo keeps the ^build dependency; args after -- reach `vitest run --project=storybook`.
          pnpm exec turbo run test --filter=nevo-repo-storybook -- "${filters[@]}"
      - name: Test ${{ matrix.package }} (full on main / nightly)
        if: github.event_name != 'pull_request' || (matrix.package != '@nevo/specflow-engine' && matrix.package != 'nevo-repo-storybook')
        env:
          PACKAGE: ${{ matrix.package }}
        run: pnpm exec turbo run test --filter="$PACKAGE"

  # Cheap one-OS packaged boundary on relevant PRs. Main retains the
  # comprehensive Ubuntu/Windows/macOS smoke matrix after merge.
  packaged-product-pr:
    name: packaged product smoke (PR / Ubuntu)
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Detect packaged-product changes
        id: affected
        shell: bash
        run: |
          git diff --name-only "${TURBO_SCM_BASE}" "${TURBO_SCM_HEAD}" > .ci-packaged-changed
          if grep -Eq '^(packages/(specflow|specflow-runtime|specflow-engine|specflow-contracts|specflow-ui|nevo-ui)/|\.github/workflows/ci\.yml$|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$)' .ci-packaged-changed; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No packaged product changes."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: ./.github/actions/setup
        if: steps.affected.outputs.run == 'true'
      - name: Smoke installed CLI + Engine Runtime from isolated tarball
        if: steps.affected.outputs.run == 'true'
        run: |
          pnpm turbo run build --filter=@nevo/specflow-engine^...
          pnpm --filter @nevo/specflow test:packaged
  # Aggregate the independently-running package tests into one stable required check.
  verify-tests:
    name: verify tests
    needs:
      - test-plan
      - package-test
      - engine-transport-smoke
      - packaged-product-pr
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    steps:
      - name: Verify tests
        env:
          PLAN_RESULT: ${{ needs.test-plan.result }}
          PACKAGE_RESULT: ${{ needs.package-test.result }}
          HAS_TESTS: ${{ needs.test-plan.outputs.has_tests }}
          TRANSPORT_RESULT: ${{ needs.engine-transport-smoke.result }}
          PACKAGED_PR_RESULT: ${{ needs.packaged-product-pr.result }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          if [ "$PLAN_RESULT" != "success" ]; then
            echo "Test planning failed: $PLAN_RESULT"
            exit 1
          fi

          if [ "$HAS_TESTS" = "true" ] && [ "$PACKAGE_RESULT" != "success" ]; then
            echo "At least one package test job failed: $PACKAGE_RESULT"
            exit 1
          fi

          if [ "$EVENT_NAME" = "pull_request" ] && [ "$TRANSPORT_RESULT" != "success" ]; then
            echo "Engine transport smoke must succeed for every ready PR: $TRANSPORT_RESULT"
            exit 1
          fi

          if [ "$EVENT_NAME" = "pull_request" ] && [ "$PACKAGED_PR_RESULT" != "success" ]; then
            echo "PR packaged-product smoke must succeed (or pass its relevance gate): $PACKAGED_PR_RESULT"
            exit 1
          fi

          echo "Package tests passed (or no package test task was affected)."

  # One stable PR signal: inexpensive real-Git/HTTP/CLI integration when
  # lifecycle or its transport contracts change, not on unrelated UI PRs.
  engine-transport-smoke:
    name: engine transport smoke
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Detect relevant changes
        id: affected
        shell: bash
        run: |
          matcher='^(packages/(specflow-engine|specflow-runtime|specflow-contracts|specflow)/|tools/ci-engine-|\.github/workflows/(ci|engine-filesystem)\.yml$|\.github/actions/setup(/|$)|\.github/actions/[^/]+/action\.yml$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|package\.json$|\.npmrc$|\.node-version$|\.nvmrc$|turbo\.json$|tools/(build-package|build-config)\.mjs$)'
          for path in packages/specflow-engine/src/index.ts packages/specflow-runtime/test/specs/create.http.test.ts packages/specflow/src/specs/command.ts packages/specflow-contracts/src/specs/close.ts tools/ci-engine-hot-shard.mjs .github/workflows/ci.yml pnpm-lock.yaml pnpm-workspace.yaml package.json .github/actions/setup/action.yml; do
            printf '%s\n' "$path" | grep -Eq "$matcher" || exit 1
          done
          for path in docs/README.md packages/specflow-ui/src/index.ts tools/storybook/package.json; do
            if printf '%s\n' "$path" | grep -Eq "$matcher"; then exit 1; fi
          done
          git diff --name-only "${TURBO_SCM_BASE}" "${TURBO_SCM_HEAD}" > .ci-engine-changed
          if grep -Eq "$matcher" .ci-engine-changed; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Engine/CLI/Runtime not affected; no lifecycle smoke needed."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: ./.github/actions/setup
        if: steps.affected.outputs.run == 'true'
      - name: Exact git and Node provenance
        if: steps.affected.outputs.run == 'true'
        run: |
          git rev-parse HEAD
          git --version
          node --version
          pnpm --version
      - name: Build CLI and Runtime test dependencies
        if: steps.affected.outputs.run == 'true'
        run: pnpm exec turbo run build --filter=@nevo/specflow-runtime --filter=@nevo/specflow
      - name: Engine real-Git lifecycle smoke
        if: steps.affected.outputs.run == 'true'
        run: pnpm --filter @nevo/specflow-engine exec vitest run test/close-worktree-lifecycle.test.ts test/close-specification-lifecycle.test.ts test/integration-destination.test.ts test/quality-hardening-q05-projections.test.ts --maxWorkers=1 --no-file-parallelism
      - name: Runtime authorized Create/Close/Overview HTTP smoke
        if: steps.affected.outputs.run == 'true'
        run: >
          pnpm --filter @nevo/specflow-runtime exec vitest run
          test/specs/create.http.test.ts
          test/specs/close.http.test.ts
          test/specs/engine-overview.http.test.ts
          --maxWorkers=1 --no-file-parallelism
      - name: Offline CLI and cross-transport smoke
        if: steps.affected.outputs.run == 'true'
        run: pnpm --filter @nevo/specflow exec vitest run test/specs-command.test.ts test/create-cross-transport.test.ts --maxWorkers=1 --no-file-parallelism

  # Packing, installed CLI and cross-OS smoke tests are integration tests:
  # run after merge, nightly or explicitly via workflow_dispatch.
  packaged-product:
    name: product smoke (${{ matrix.os }})
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Pack and smoke installed product
        run: |
          pnpm turbo run build --filter=@nevo/specflow-engine^...
          pnpm --filter @nevo/specflow test:packaged

  verify-product-smoke:
    name: product smoke
    needs: packaged-product
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Verify product smoke matrix
        env:
          RESULT: ${{ needs.packaged-product.result }}
        shell: bash
        run: |
          if [ "$RESULT" != "success" ]; then
            echo "At least one packaged-product smoke job failed: $RESULT"
            exit 1
          fi
          echo "Packaged-product smoke passed on Linux, Windows and macOS."

  build:
    name: build
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Build
        run: pnpm exec turbo run build ${{ env.AFFECTED }}
