name: CodeQL

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches:
      - main
      - "release/v*"
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: codeql
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2

      - name: Diagnose CodeQL SARIF results (temporary)
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const resultDir = path.resolve(process.env.GITHUB_WORKSPACE, '..', 'results');
          if (!fs.existsSync(resultDir)) {
            console.log('CodeQL results directory not found:', resultDir);
          } else {
            for (const name of fs.readdirSync(resultDir).filter((x) => x.endsWith('.sarif'))) {
              const data = JSON.parse(fs.readFileSync(path.join(resultDir, name), 'utf8'));
              for (const run of data.runs || []) {
                for (const result of run.results || []) {
                  const loc = result.locations?.[0]?.physicalLocation;
                  console.log('CODEQL_FINDING ' + JSON.stringify({
                    ruleId: result.ruleId,
                    message: result.message?.text,
                    location: loc?.artifactLocation?.uri,
                    line: loc?.region?.startLine,
                    severity: result.level,
                  }));
                }
              }
            }
          }
          NODE
