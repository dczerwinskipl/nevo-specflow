name: Cut release line

# Manually triggered. Creates `release/vX.Y` off the current origin/main (with its
# own version.json set to the beta channel) and opens — or hands off — the PR that
# moves `main` onto the explicitly chosen next line. The next version is an input.

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Version this line stabilizes, e.g. 1.3.0"
        required: true
      next_development_version:
        description: "Next line for main — next minor OR next major, e.g. 1.4.0 or 2.0.0"
        required: true
      execute:
        description: "Create the branch and (with CI_GITHUB_RELEASE_TOKEN) the PR — unchecked = validate only"
        type: boolean
        default: false

# Least privilege — exactly the GitHub APIs this workflow calls:
#   contents: write       push release/vX.Y and the main-bump branch (git plumbing)
#   pull-requests: write   open the main-bump PR; request auto-merge
# It does not read check-runs, so no `checks:` permission.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: cut-release-line
  cancel-in-progress: false

jobs:
  cut:
    name: cut
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # A PAT lets the main-bump PR trigger CI so auto-merge can land it.
          # Without it the branches are still created and the exact `gh pr create`
          # command is printed for a maintainer to run. See docs/engineering/repository/releasing.md.
          token: ${{ secrets.CI_GITHUB_RELEASE_TOKEN || github.token }}
      - uses: ./.github/actions/setup

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Build the release tool
        run: pnpm --filter nevo-repo-release build

      - name: Cut
        env:
          GH_TOKEN: ${{ secrets.CI_GITHUB_RELEASE_TOKEN || github.token }}
          CI_GITHUB_RELEASE_TOKEN_PRESENT: ${{ secrets.CI_GITHUB_RELEASE_TOKEN != '' }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          NEXT_DEVELOPMENT_VERSION: ${{ inputs.next_development_version }}
          EXECUTE: ${{ inputs.execute }}
        run: node tools/release/dist/bin.js cut-line
