name: PR title

# The PR title becomes the squash commit message on main / release/v*, so it must
# follow Conventional Commits. Checkpoint commits on the branch are not checked.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Keep in sync with docs/engineering/repository/commit-conventions.md.
          types: |
            feat
            fix
            docs
            refactor
            test
            build
            ci
            chore
            perf
            revert
          # Permanent squash commits use `<type>(<scope>): <description>`.
          # Scopes are open-ended — see docs/engineering/repository/commit-conventions.md.
          requireScope: true
          subjectPattern: ^(?![A-Z])(?!.*\.$).+$
          subjectPatternError: |
            The subject "{subject}" must start lower-case and not end with a period.
