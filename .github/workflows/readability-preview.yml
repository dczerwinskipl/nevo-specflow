name: Temporary single-file readability autofix

# Diagnostic PR-only workflow. Edit precisely one source file on the PR branch.
# Remove this workflow after the readability rollout.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - eslint.base.mjs
      - .github/workflows/readability-preview.yml

permissions:
  contents: write

concurrency:
  group: readability-autofix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  autofix:
    name: Autofix Codex questions.ts on PR branch
    # Do not check out or push to fork branches with a write-capable token.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: ./.github/actions/setup

      - name: Autofix, validate, and commit one file
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          TARGET_FILE: packages/specflow-runtime/src/features/sessions/providers/codex/questions.ts
        run: |
          set -euo pipefail

          # Verify the target is tracked. Never stage changes outside this file.
          git ls-files --error-unmatch -- "$TARGET_FILE" > /dev/null

          (
            cd packages/specflow-runtime
            pnpm exec eslint src/features/sessions/providers/codex/questions.ts --fix
          )
          pnpm exec prettier --write "$TARGET_FILE"

          # Verify the resulting source before touching the PR branch.
          (
            cd packages/specflow-runtime
            pnpm exec eslint src/features/sessions/providers/codex/questions.ts
          )
          pnpm exec prettier --check "$TARGET_FILE"
          git diff --check -- "$TARGET_FILE"

          git diff -- "$TARGET_FILE" > "$RUNNER_TEMP/readability-autofix.patch"
          {
            echo "## Single-file readability autofix"
            echo ""
            echo "Only \`$TARGET_FILE\` is eligible for commit."
            echo ""
            echo '~~~diff'
            sed -n '1,160p' "$RUNNER_TEMP/readability-autofix.patch"
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

          if git diff --quiet -- "$TARGET_FILE"; then
            echo "Already formatted; nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$TARGET_FILE"

          # Refuse any unexpected staged changes.
          if [[ "$(git diff --cached --name-only)" != "$TARGET_FILE" ]]; then
            echo "Unexpected staged files; refusing to commit."
            exit 1
          fi

          git commit -m "style(runtime): format Codex questions with readability rules"
          git push origin "HEAD:$HEAD_REF"

      - name: Upload single-file patch
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: readability-autofix-${{ github.run_id }}
          path: ${{ runner.temp }}/readability-autofix.patch
          if-no-files-found: warn
