name: Refresh auth docs index

on:
  push:
    branches:
      - feature/auth-login-init

permissions:
  contents: write

jobs:
  docs-index:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Regenerate documentation index
        run: pnpm docs:check --write
      - name: Commit generated index
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Documentation index is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.generated.json docs/index.generated.md
          git commit -m "docs: refresh generated index"
          git push origin HEAD:feature/auth-login-init
