name: Runtime 172 Docker verification

on:
  push:
    branches: [chore/runtime-172-docker-5s]

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fd167d8d5f07f705f29d1bd2d81ec7d4e580b4b0
          persist-credentials: false
      - name: Record runner capacity
        run: |
          nproc
          free -h
      - name: Verify direct Vitest uses the Runtime test configuration
        env:
          NEVO_TEST_REF: fd167d8d5f07f705f29d1bd2d81ec7d4e580b4b0
        run: |
          bash tools/dev/linux-test.sh --ref "$NEVO_TEST_REF" --memory 10g --cpus 4 -- \
            "node -e 'console.log(require(\"node:os\").availableParallelism())' && git config --global maintenance.auto false && git config --global gc.auto 0 && pnpm exec turbo run build --filter=@nevo/specflow-runtime && pnpm --filter @nevo/specflow-runtime exec vitest run --reporter=dot"
