name: Runtime Linux default-timeout verification
on:
  push:
    branches: [chore/runtime-172-linux-replay]
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup
      - name: Build Runtime and print runner details
        run: |
          node --version
          nproc
          free -h
          pnpm exec turbo run build --filter=@nevo/specflow-runtime
      - name: Run the full Runtime suite at Vitest's default timeout
        run: pnpm --filter @nevo/specflow-runtime exec vitest run --reporter=dot
