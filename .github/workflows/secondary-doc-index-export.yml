name: Temporary Secondary Docs Index Export

on:
  push:
    branches:
      - feature/workspace-secondary-stack-navigation
    paths:
      - .github/workflows/secondary-doc-index-export.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Rebuild documentation indexes
        run: pnpm docs:check --write
      - name: Export generated indexes
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          for (const path of ['docs/index.generated.json', 'docs/index.generated.md']) {
            console.log('SECONDARY_DOC_INDEX:' + path + ':' + readFileSync(path).toString('base64'));
          }
          NODE
