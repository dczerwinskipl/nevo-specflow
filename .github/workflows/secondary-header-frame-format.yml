name: Temporary Secondary Header Frame Format

on:
  push:
    branches:
      - feature/workspace-secondary-stack-navigation
    paths:
      - .github/workflows/secondary-header-frame-format.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Format changed sources and refresh documentation index
        run: |
          pnpm exec prettier --write \
            packages/nevo-ui/src/app/workspace/WorkspaceHeader.tsx \
            packages/nevo-ui/src/app/workspace/WorkspaceContext.tsx \
            packages/nevo-ui/src/app/workspace/SecondaryStack.ts \
            packages/nevo-ui/src/app/workspace/AppWorkspace.tsx \
            packages/nevo-ui/src/app/index.ts \
            packages/nevo-ui/src/app/workspace/examples/SecondaryHeaderActionsExample.stories.tsx \
            packages/nevo-ui/src/app/workspace/WorkspaceHeader.test.tsx \
            examples/crm/src/CrmExample.tsx \
            docs/design-system/implementation/react/secondary-navigation.md
          pnpm docs:check --write
      - name: Export generated files
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { readFileSync } from 'node:fs';
          const paths = execFileSync('git', ['diff', '--name-only'], { encoding: 'utf8' }).trim().split('\n').filter(Boolean);
          for (const path of paths) console.log('HEADER_FRAME_FILE:' + path + ':' + readFileSync(path).toString('base64'));
          console.log('HEADER_FRAME_COUNT:' + paths.length);
          NODE
