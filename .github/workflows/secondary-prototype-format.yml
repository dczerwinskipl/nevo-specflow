name: Temporary Secondary formatting export

on:
  push:
    branches:
      - feature/workspace-secondary-stack-navigation
    paths:
      - .github/workflows/secondary-prototype-format.yml

permissions:
  contents: read

jobs:
  format-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Format changed files
        run: |
          pnpm exec prettier --write \
            examples/crm/src/CrmExample.tsx \
            packages/nevo-ui/src/app/index.ts \
            packages/nevo-ui/src/app/shell/AppShell.stories.tsx \
            packages/nevo-ui/src/app/workspace/AppWorkspace.stories.tsx \
            packages/nevo-ui/src/app/workspace/AppWorkspace.tsx \
            packages/nevo-ui/src/app/workspace/SecondaryStack.ts \
            packages/nevo-ui/src/app/workspace/WorkspaceContext.contract.stories.tsx \
            packages/nevo-ui/src/app/workspace/WorkspaceContext.tsx \
            packages/nevo-ui/src/app/workspace/examples/DemoStore.ts \
            packages/nevo-ui/src/app/workspace/examples/SecondaryStackExample.stories.tsx \
            packages/nevo-ui/src/app/workspace/examples/SecondaryStackExample.tsx \
            packages/nevo-ui/src/app/workspace/examples/SidebarScreens.tsx \
            packages/nevo-ui/src/app/workspace/examples/createDemoStacks.ts \
            docs/design-system/implementation/react/secondary-navigation.md \
            docs/ideas/specflow-ui/design-system-component-composition-gaps.md
      - name: Export formatted file contents to job log
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { readFileSync } from 'node:fs';
          const changed = execFileSync('git', ['diff', '--name-only'], { encoding: 'utf8' })
            .trim().split('\n').filter(Boolean);
          for (const path of changed) {
            console.log('SECONDARY_FORMAT_FILE:' + path + ':' + readFileSync(path).toString('base64'));
          }
          console.log('SECONDARY_FORMAT_COUNT:' + changed.length);
          NODE
