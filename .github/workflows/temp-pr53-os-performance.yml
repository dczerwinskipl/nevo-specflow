name: Temporary PR53 OS performance discovery
on:
  push:
    branches: [ci/pr53-os-perf-discovery]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr53-os-perf-discovery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  profile:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, windows-2025]
    name: OS perf discovery (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Process and Git microbenchmark
        run: node tools/perf-diagnostic.mjs
      - uses: ./.github/actions/setup
      - name: Toolchain
        run: |
          node --version
          git --version
          pnpm --version
      - name: Baseline no-Git test
        run: pnpm --filter @nevo/specflow-engine exec vitest run test/version-control-policy.test.ts --testTimeout=20000 --maxWorkers=1 --no-file-parallelism --reporter=verbose
      - name: Representative durable-create regression
        run: pnpm --filter @nevo/specflow-engine exec vitest run test/durable-create.test.ts --testTimeout=20000 --maxWorkers=1 --no-file-parallelism --reporter=verbose
      - name: LC26 default Git checkout - expected Windows line ending mismatch
        continue-on-error: true
        run: pnpm --filter @nevo/specflow-engine exec vitest run test/close-worktree-lifecycle.test.ts -t "LC26: integrates real Unicode and spaced Git paths with index and file parity" --testTimeout=20000 --maxWorkers=1 --no-file-parallelism --reporter=verbose
      - name: LC26 with isolated Git autocrlf=false
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        run: pnpm --filter @nevo/specflow-engine exec vitest run test/close-worktree-lifecycle.test.ts -t "LC26: integrates real Unicode and spaced Git paths with index and file parity" --testTimeout=20000 --maxWorkers=1 --no-file-parallelism --reporter=verbose
      - name: LC21 targeted active-Git SIGKILL
        run: pnpm --filter @nevo/specflow-engine exec vitest run test/close-sigkill.test.ts -t "LC21: killing the active Git merge leaves uncertain physical state fenced" --testTimeout=20000 --maxWorkers=1 --no-file-parallelism --reporter=verbose
