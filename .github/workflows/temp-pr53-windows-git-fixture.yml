name: Temporary PR53 cross-platform Git recovery regression
on:
  push:
    branches: [ci/pr53-windows-git-fixture-fix]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lifecycle:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-26]
    name: LC21 and LC26 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Force hostile Git normalization default
        shell: bash
        run: |
          git config --global core.autocrlf true
          git config --global --get core.autocrlf
          node --version
          git --version
      - name: LC26 Unicode and exact physical bytes
        run: |
          pnpm --filter @nevo/specflow-engine exec vitest run test/close-worktree-lifecycle.test.ts -t "LC26: integrates real Unicode and spaced Git paths with index and file parity" --testTimeout=20000 --maxWorkers=1 --no-file-parallelism --reporter=verbose
      - name: LC21 SIGKILL live Git merge and physical recovery
        run: |
          pnpm --filter @nevo/specflow-engine exec vitest run test/close-sigkill.test.ts -t "LC21: killing the active Git merge leaves uncertain physical state fenced" --testTimeout=20000 --maxWorkers=1 --no-file-parallelism --reporter=verbose
