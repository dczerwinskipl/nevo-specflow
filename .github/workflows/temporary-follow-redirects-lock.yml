name: Temporary Security Lockfile Rebuild
on:
  push:
    branches: [fix/follow-redirects-and-chromatic-diagnostics]
    paths: [.github/workflows/temporary-follow-redirects-lock.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/follow-redirects-and-chromatic-diagnostics
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - name: Resolve patched transitive dependency using pinned pnpm
        run: |
          pnpm install --lockfile-only --no-frozen-lockfile
          pnpm install --frozen-lockfile
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const lock = fs.readFileSync('pnpm-lock.yaml', 'utf8');
          if (!lock.includes('follow-redirects@1.16.1:') ||
              lock.includes('follow-redirects@1.16.0:')) {
            throw new Error('Unsafe follow-redirects version persists in lockfile.');
          }
          console.log('Confirmed only patched follow-redirects@1.16.1 is resolved.');
          NODE
      - name: Commit only canonical lockfile and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temporary-follow-redirects-lock.yml
          git add pnpm-lock.yaml
          git diff --cached --check
          git commit -m "fix(deps): regenerate lockfile for patched follow-redirects"
          git push origin HEAD:fix/follow-redirects-and-chromatic-diagnostics
