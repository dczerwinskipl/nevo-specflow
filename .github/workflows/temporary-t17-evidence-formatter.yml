name: Temporary T17 Test Formatting
on:
  push:
    branches:
      - feature/specflow-engine-foundation
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Format evidence tests
        run: pnpm exec prettier --write packages/specflow-engine/test/close-sigkill.test.ts packages/specflow-engine/test/lifecycle-admission.test.ts packages/specflow-engine/test/close-worktree-lifecycle.test.ts packages/specflow-engine/test/archive-close.test.ts packages/specflow-engine/test/close-process-contention.test.ts packages/specflow-engine/test/fixtures/close-race-worker.test.ts
      - name: Emit formatted test files
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const paths=["packages/specflow-engine/test/close-sigkill.test.ts","packages/specflow-engine/test/lifecycle-admission.test.ts","packages/specflow-engine/test/close-worktree-lifecycle.test.ts","packages/specflow-engine/test/archive-close.test.ts","packages/specflow-engine/test/close-process-contention.test.ts","packages/specflow-engine/test/fixtures/close-race-worker.test.ts"];
          for(const path of paths){
            console.log('NEVO_T17_FMT:'+JSON.stringify({path,content:fs.readFileSync(path,'utf8')}));
          }
          NODE
