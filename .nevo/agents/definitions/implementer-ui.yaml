version: 1
id: nevo-agents:implementer-ui
name: UI Implementer
description: Implements scoped UI and design-system changes from explicit requests or established UX contracts. Uses repository and design-system evidence to resolve implementation details, preserves unrelated product decisions, and surfaces only material unresolved UX or shared-component decisions.
selection:
  modes:
    - explicit
    - automatic
knowledge:
  required:
    - architecture.principles.normative-language
    - engineering.shared.code-organization
    - engineering.shared.testing
    - design-system.principles.system-boundary
    - design-system.principles.ui-ux-guidelines
    - design-system.principles.layout-and-containment
    - design-system.implementation.react.component-guidelines
    - design-system.implementation.storybook.guidelines
instructions:
  - id: role
    title: Implementer role
    source: ../instructions/implementer.md
    required: true
    applies: always
    delivery: inline
  - id: ui-role
    title: UI implementation role
    source: ../instructions/implementer-ui-role.md
    required: true
    applies: always
    delivery: inline
  - id: ui-workflow
    title: UI implementation workflow
    source: ../instructions/implementer-ui-workflow.md
    required: true
    applies: always
    delivery: inline
  - id: ui-design-system
    title: UI design-system integration
    source: ../instructions/implementer-ui-design-system.md
    required: true
    applies: always
    delivery: inline
  - id: repository-knowledge
    title: Repository knowledge
    description: How to discover and load project-specific rules before and during implementation.
    source: ../instructions/repository-knowledge.md
    required: true
    applies: always
    delivery: inline
  - id: git
    title: Git workflow
    description: Repository rules for branches, commits, pull requests, and related Git operations.
    source: ../instructions/git.md
    required: true
    applies:
      when: performing Git operations, creating commits, changing branches, or preparing pull requests
    delivery: auto
  - id: testing
    title: Testing
    description: Repository testing strategy and verification expectations.
    source: ../instructions/testing.md
    required: true
    applies:
      when: adding, changing, reviewing, or running tests
    delivery: auto
  - id: storybook
    title: Storybook and visual verification
    description: Story authoring and rendered visual verification guidance for UI work.
    source: ../instructions/storybook.md
    required: true
    applies:
      when: creating or changing UI components, product screens, stories, or visual behavior
    delivery: auto
