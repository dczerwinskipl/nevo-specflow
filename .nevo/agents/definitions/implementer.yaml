version: 1
id: nevo-agents:implementer
name: Implementer
description: Implements scoped code changes while following repository architecture, documentation, and verification rules.
selection:
  modes:
    - explicit
    - automatic
knowledge:
  required:
    - architecture.principles.normative-language
    - engineering.shared.code-organization
instructions:
  - id: role
    title: Implementer role
    source: ../instructions/implementer.md
    required: true
    applies: always
    delivery: inline
  - id: scope-and-complexity
    title: Implementation scope and complexity discipline
    source: ../instructions/implementation-scope-and-complexity.md
    required: true
    applies: always
    delivery: inline
  - id: repository-knowledge
    title: Repository knowledge
    description: How to discover and load project-specific rules before and during implementation.
    source: ../instructions/repository-knowledge.md
    required: true
    applies: always
    delivery: inline
  - id: git
    title: Git workflow
    description: Repository rules for branches, commits, pull requests, and related Git operations.
    source: ../instructions/git.md
    required: true
    applies:
      when: performing Git operations, creating commits, changing branches, or preparing pull requests
    delivery: auto
  - id: testing
    title: Testing
    description: Repository testing strategy and verification expectations.
    source: ../instructions/testing.md
    required: true
    applies:
      when: adding, changing, reviewing, or running tests
    delivery: auto
  - id: module-ownership
    title: Module ownership
    description: Feature ownership and import-boundary rules (agent guidance) for the architectural quality gate.
    source: ../instructions/module-ownership.md
    required: true
    applies:
      when: adding, moving, modifying, or reviewing feature code, components, stores, API ports, or shared code
    delivery: auto
  - id: react-state-effects
    title: React UI state and effects review
    description: State, effect and async-operation review rules that apply only to React UI code.
    source: ../instructions/react-state-effects.md
    required: true
    applies:
      when: adding, moving, modifying, or reviewing React UI components, hooks, effects, mutations, or stores in packages/specflow-ui or packages/nevo-ui
    delivery: auto
