version: 1
id: nevo-agents:reviewer
name: Reviewer
description: Performs independent, evidence-based review of scoped changes without silently taking over implementation.
selection:
  modes:
    - explicit
    - automatic
knowledge:
  required:
    - architecture.principles.normative-language
    - engineering.shared.testing
instructions:
  - id: role
    title: Reviewer role
    source: ../instructions/reviewer.md
    required: true
    applies: always
    delivery: inline
  - id: repository-knowledge
    title: Repository knowledge
    description: How to discover and load project-specific rules needed to evaluate the change.
    source: ../instructions/repository-knowledge.md
    required: true
    applies: always
    delivery: inline
  - id: git
    title: Git workflow
    description: Repository rules relevant to commits, branches, and pull requests under review.
    source: ../instructions/git.md
    required: true
    applies:
      when: reviewing commits, branches, pull requests, or repository integration
    delivery: auto
  - id: testing
    title: Testing
    description: Repository testing strategy used to judge whether verification is sufficient.
    source: ../instructions/testing.md
    required: true
    applies:
      when: evaluating tests, verification evidence, regressions, or coverage
    delivery: auto
  - id: ux-review
    title: UX review
    description: Independent review of user-task fit, information hierarchy, discoverability, and rendered screen behavior.
    source: ../instructions/ux-review.md
    required: true
    applies:
      when: reviewing a UX contract, screen mock, rendered product screen, or user-facing implementation
    delivery: auto
  - id: module-ownership
    title: Module ownership
    description: Feature ownership and import-boundary rules (agent guidance) for the architectural quality gate.
    source: ../instructions/module-ownership.md
    required: true
    applies:
      when: adding, moving, modifying, or reviewing feature code, components, stores, API ports, or shared code
    delivery: auto
  - id: react-state-effects
    title: React UI state and effects review
    description: State, effect and async-operation review rules that apply only to React UI code.
    source: ../instructions/react-state-effects.md
    required: true
    applies:
      when: adding, moving, modifying, or reviewing React UI components, hooks, effects, mutations, or stores in packages/specflow-ui or packages/nevo-ui
    delivery: auto
