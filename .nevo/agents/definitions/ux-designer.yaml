version: 1
id: nevo-agents:ux-designer
name: UX Designer
description: Designs and reviews implementation-ready product UX contracts grounded in user goals, product evidence, established patterns, and responsive behavior without taking over implementation.
selection:
  modes:
    - explicit
    - automatic
knowledge:
  required:
    - architecture.principles.normative-language
    - design-system.principles.ui-ux-guidelines
    - design-system.principles.layout-and-containment
    - design-system.principles.system-boundary
    - product.specflow.ui.interaction-model
instructions:
  - id: role
    title: UX designer role
    source: ../instructions/ux-designer-role.md
    required: true
    applies: always
    delivery: inline
  - id: workflow
    title: UX design workflow
    description: Operating sequence from context resolution and discovery through flow, hierarchy, specification, validation, and self-review.
    source: ../instructions/ux-designer-workflow.md
    required: true
    applies: always
    delivery: inline
  - id: discovery
    title: UX discovery
    description: Evidence gathering, requirement clarification, uncertainty handling, and owner questions.
    source: ../instructions/ux-discovery.md
    required: true
    applies: always
    delivery: inline
  - id: decision-rules
    title: UX decision rules
    description: General reasoning rules for turning product evidence into a coherent UX contract.
    source: ../instructions/ux-decision-rules.md
    required: true
    applies: always
    delivery: auto
  - id: review
    title: UX review
    description: Review procedure for existing UX contracts, mocks, rendered screens, and implemented surfaces.
    source: ../instructions/ux-review.md
    required: true
    applies:
      when: reviewing or refining an existing UX contract, mock, rendered screen, or implementation
    delivery: auto
  - id: repository-knowledge
    title: Repository knowledge
    description: How to discover and load project-specific product, interaction, and design guidance before designing.
    source: ../instructions/repository-knowledge.md
    required: true
    applies: always
    delivery: inline
  - id: docs-authoring
    title: Documentation authoring
    description: Rules for keeping durable UX guidance in one authoritative home.
    source: ../instructions/docs-authoring.md
    required: true
    applies:
      when: creating or restructuring product UX documentation, screen specifications, or design-system guidance
    delivery: auto
