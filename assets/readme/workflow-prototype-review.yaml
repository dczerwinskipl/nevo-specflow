steps:
  review:
    exitGates:
      - type: command
        action: test
    finalize:
      - id: commit-and-push
    transitions:
      - value: pass
        to: human-verification
        continuation: auto
      - value: fail
        to: implementation
        continuation: auto
        execution:
          session: fresh
          role: refiner
