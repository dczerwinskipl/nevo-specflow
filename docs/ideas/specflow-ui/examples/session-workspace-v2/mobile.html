<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Nevo SpecFlow — Session Context / Mobile V2</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b121a;
        --surface: #141f2a;
        --surface2: #1b2937;
        --line: #2e3d4c;
        --text: #e6edf3;
        --muted: #9bacbb;
        --sub: #879cac;
        --accent: #9dc3f0;
        --orange: #dfb37d;
        --red: #e4a3a4;
        --green: #a2ceba;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: #0b1119;
        color: var(--text);
        font:
          13px/1.5 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Arial,
          sans-serif;
      }
      button,
      input,
      textarea,
      select {
        font: inherit;
        color: inherit;
      }
      button {
        border: 0;
        background: none;
        cursor: pointer;
      }
      button:focus-visible,
      input:focus-visible,
      textarea:focus-visible {
        outline: 2px solid #8ab8f4;
        outline-offset: 2px;
      }
      svg {
        flex-shrink: 0;
      }
      #mobile {
        max-width: 430px;
        width: 100%;
        height: min(100dvh, 930px);
        min-height: 630px;
        margin: auto;
        background: #101923;
        display: flex;
        flex-direction: column;
        border: 1px solid #283847;
        box-shadow: 0 12px 50px #0005;
        overflow: hidden;
      }
      .microhead {
        height: 47px;
        padding: 0 15px;
        display: flex;
        align-items: center;
        gap: 9px;
        flex: 0 0 auto;
      }
      .microhead .brand {
        font-size: 13px;
        font-weight: 780;
        letter-spacing: -0.4px;
      }
      .microhead .brand em {
        font-weight: 450;
        font-style: normal;
        color: #9cbce8;
      }
      .microhead .right {
        margin-left: auto;
        display: flex;
        gap: 4px;
      }
      .btnicon {
        display: grid;
        place-items: center;
        width: 33px;
        height: 33px;
        border-radius: 8px;
        color: #b8cada;
      }
      .btnicon:active {
        background: #26394a;
      }
      .screen {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        background: #151f2b;
        border: 1px solid #2c3d4e;
        border-radius: 19px 19px 0 0;
        overflow: hidden;
      }
      .screenhead {
        padding: 15px 15px 12px;
        display: flex;
        align-items: center;
        gap: 8px;
        border-bottom: 1px solid #2b3b4a;
        flex: 0 0 auto;
        min-height: 67px;
      }
      .screenhead .titlewrap {
        flex: 1;
        min-width: 0;
      }
      .screenhead h1 {
        font-size: 15px;
        font-weight: 650;
        letter-spacing: -0.3px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin: 0 0 3px;
      }
      .screenhead .hint {
        font-size: 11px;
        color: #99aebc;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .screenhead .iconbtn {
        color: #aec0d0;
        display: grid;
        place-items: center;
        padding: 5px;
        border-radius: 6px;
      }
      .screenhead .iconbtn:active {
        background: #293b4c;
      }
      .body {
        flex: 1;
        min-height: 0;
        overflow: auto;
        overscroll-behavior: contain;
        scrollbar-color: #405165 transparent;
      }
      .full {
        display: flex;
        flex-direction: column;
        min-height: 0;
        flex: 1;
      }
      .context-layout .sectionbar {
        position: sticky;
        top: 0;
        z-index: 3;
        background: #151f2b;
        border-bottom: 1px solid #2c3b49;
        display: flex;
        overflow: auto;
        scrollbar-width: none;
        gap: 5px;
        padding: 10px 12px;
      }
      .sectionbar button {
        white-space: nowrap;
        border: 1px solid #3b4b5c;
        padding: 7px 11px;
        border-radius: 8px;
        color: #adbfcc;
        font-size: 11px;
      }
      .sectionbar button.active {
        color: #deefff;
        border-color: #55799c;
        background: #293f55;
      }
      .content {
        padding: 17px 16px 30px;
      }
      .label {
        font-size: 10px;
        font-weight: 750;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #9eafc0;
        margin: 18px 0 9px;
      }
      .label:first-child {
        margin-top: 0;
      }
      .focus {
        border-left: 2px solid #96bff0;
        padding: 9px 12px;
        background: linear-gradient(90deg, #223344, transparent);
        margin-bottom: 16px;
      }
      .focus strong {
        font-size: 13px;
      }
      .focus p {
        font-size: 11px;
        color: #aebecb;
        line-height: 1.65;
        margin: 6px 0 0;
      }
      .muted {
        color: var(--muted);
      }
      .subtle {
        color: var(--sub);
      }
      .small {
        font-size: 11px;
      }
      .status {
        font-size: 10px;
        color: var(--muted);
        white-space: nowrap;
      }
      .status.running {
        color: var(--accent);
      }
      .status.attention {
        color: var(--orange);
      }
      .status.danger {
        color: var(--red);
      }
      .status.success {
        color: var(--green);
      }
      .pill {
        display: inline-block;
        font-size: 10px;
        border: 1px solid #455466;
        color: #b3c4d1;
        padding: 3px 7px;
        border-radius: 5px;
      }
      .pill.blue {
        color: #c3dafa;
        background: #253a50;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        margin: 8px 0;
      }
      .row {
        display: flex;
        gap: 10px;
        align-items: center;
        width: 100%;
        text-align: left;
        min-height: 52px;
        border-bottom: 1px solid #2d3e4d;
        padding: 10px 0;
      }
      .row:last-child {
        border-bottom: 0;
      }
      .row > svg:first-child {
        color: #a5b8ca;
      }
      .row .main {
        flex: 1;
        min-width: 0;
      }
      .row .text {
        display: block;
        font-size: 12px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .row .desc {
        display: block;
        color: #94a9b8;
        font-size: 10px;
        margin-top: 4px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .row .right {
        flex-shrink: 0;
      }
      .row:active {
        background: #213144;
      }
      .count {
        color: #b9d2ed;
        background: #293f55;
        border-radius: 5px;
        font-size: 10px;
        padding: 2px 6px;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin: 15px 0 18px;
      }
      .stat strong {
        font-size: 21px;
        font-weight: 700;
      }
      .stat small {
        display: block;
        font-size: 10px;
        color: #99afbf;
      }
      .rule {
        height: 1px;
        background: #30404d;
        margin: 17px 0;
      }
      .alert {
        padding: 11px 13px;
        border: 1px solid #66523e;
        border-radius: 9px;
        color: #e8d2b6;
        background: #2c2927;
        font-size: 11px;
        line-height: 1.55;
        margin: 14px 0;
      }
      .alert b {
        display: block;
        margin-bottom: 4px;
      }
      .searchbox {
        height: 40px;
        border: 1px solid #455767;
        border-radius: 9px;
        display: flex;
        gap: 9px;
        align-items: center;
        padding: 0 10px;
        background: #1b2a39;
      }
      .searchbox svg {
        color: #a8bccd;
      }
      .searchbox input {
        background: none;
        border: 0;
        outline: 0;
        flex: 1;
        min-width: 0;
        font-size: 12px;
      }
      .filterchips {
        display: flex;
        gap: 5px;
        overflow-x: auto;
        padding: 11px 0 5px;
        scrollbar-width: none;
      }
      .filterchips button {
        border: 1px solid #415264;
        border-radius: 7px;
        padding: 6px 9px;
        white-space: nowrap;
        color: #b5c4d2;
        font-size: 10px;
      }
      .filterchips button.active {
        background: #2b4360;
        border-color: #6085a5;
        color: #e1f0ff;
      }
      .resultcount {
        font-size: 11px;
        color: #90a5b5;
        padding: 8px 0;
      }
      .load {
        width: 100%;
        padding: 12px;
        border: 1px solid #42566c;
        border-radius: 8px;
        margin: 16px 0;
        color: #c0d9f7;
        font-size: 11px;
      }
      .event {
        margin-left: 7px;
        padding: 0 0 23px 20px;
        border-left: 1px solid #3b4b5d;
        position: relative;
      }
      .event:before {
        position: absolute;
        content: '';
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #7d9ab8;
        left: -4px;
        top: 5px;
      }
      .event.rejected:before {
        background: #bf8680;
      }
      .event.active:before {
        background: #95bfe9;
      }
      .event .when {
        color: #879dac;
        font-size: 10px;
      }
      .event .headline {
        font-size: 12px;
        margin: 6px 0;
      }
      .event .detail {
        font-size: 11px;
        color: #9bb0c1;
        line-height: 1.6;
      }
      .textbutton {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        color: #abd1fa;
        font-size: 11px;
        padding: 7px 0;
      }
      .document {
        font-size: 13px;
        line-height: 1.75;
        color: #c1d2de;
      }
      .document h2 {
        font-size: 18px;
        line-height: 1.3;
        margin: 18px 0 10px;
      }
      .code {
        background: #101a24;
        border: 1px solid #364a5b;
        border-radius: 8px;
        padding: 13px;
        font:
          11px/1.7 ui-monospace,
          SFMono-Regular,
          Consolas,
          monospace;
        overflow: auto;
        white-space: pre;
      }
      .diff {
        background: #111b25;
        border: 1px solid #384958;
        border-radius: 8px;
        overflow: auto;
      }
      .diff div {
        font:
          11px/1.5 ui-monospace,
          SFMono-Regular,
          Consolas,
          monospace;
        white-space: pre;
        padding: 4px 10px;
      }
      .diff .add {
        background: #203c2f;
        color: #c1e4d0;
      }
      .diff .del {
        background: #3b2628;
        color: #e0a5a5;
      }
      .diff .muted {
        color: #94a6b7;
      }
      .segmented {
        display: flex;
        border: 1px solid #3f5265;
        background: #1c2b3b;
        border-radius: 8px;
        padding: 3px;
        gap: 3px;
        margin: 12px 0;
      }
      .segmented button {
        flex: 1;
        color: #a8bac8;
        padding: 8px 3px;
        border-radius: 5px;
        font-size: 11px;
      }
      .segmented button.active {
        background: #324963;
        color: #eff5fc;
      }
      .detailhead {
        padding: 12px 16px 0;
      }
      .detailhead h2 {
        font-size: 16px;
        margin: 0;
      }
      .detailhead p {
        font-size: 11px;
        color: #9aafc0;
        margin: 5px 0;
      }
      .tasksteps {
        font-size: 11px;
        color: #a5b8c9;
        line-height: 1.8;
      }
      .kv {
        display: flex;
        gap: 20px;
        align-items: flex-start;
        justify-content: space-between;
        border-bottom: 1px solid #2b3e4b;
        padding: 10px 0;
        font-size: 11px;
      }
      .kv span {
        color: #9aafc1;
      }
      .kv strong {
        text-align: right;
        font-weight: 550;
        max-width: 58%;
      }
      .convo {
        padding: 18px 17px 24px;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      .message-you {
        padding: 11px 13px;
        border: 1px solid #3c5163;
        background: #223346;
        border-radius: 11px;
        align-self: flex-end;
        max-width: 87%;
        font-size: 12px;
        line-height: 1.6;
      }
      .assistant-message {
        font-size: 12px;
        line-height: 1.75;
      }
      .assistant-message p {
        margin: 0 0 12px;
      }
      .agentlabel {
        color: #a9c3df;
        font-size: 11px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 8px;
      }
      .workref {
        border: 0;
        border-bottom: 1px solid #314153;
        background: none;
        display: flex;
        align-items: center;
        gap: 8px;
        color: #a9bdcf;
        padding: 8px 0;
        font-size: 11px;
        width: 100%;
        text-align: left;
        margin: 3px 0;
      }
      .filelink {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        border: 1px solid #3b5870;
        color: #b7d7f9;
        background: #21364b;
        border-radius: 6px;
        padding: 4px 7px;
        font-size: 11px;
      }
      .live {
        padding: 8px 14px;
        border-top: 1px solid #314353;
        color: #b3c8d9;
        font-size: 11px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .composerwrap {
        padding: 9px 12px 15px;
        background: #111b26;
        flex-shrink: 0;
      }
      .composer {
        background: #1d2b3b;
        border: 1px solid #45596b;
        border-radius: 12px;
        overflow: hidden;
      }
      .composer textarea {
        resize: none;
        border: 0;
        outline: 0;
        background: none;
        width: 100%;
        min-height: 55px;
        height: 58px;
        padding: 10px 13px;
        color: #e8eff6;
        font-size: 12px;
      }
      .composer textarea::placeholder {
        color: #8ea5b8;
      }
      .composerbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-top: 1px solid #334658;
        padding: 6px 9px;
        color: #a3b8c8;
        font-size: 11px;
      }
      .composerbar button {
        background: #4e81ae;
        border-radius: 7px;
        color: #fff;
        padding: 5px 7px;
      }
      .mobiletabs {
        border-top: 1px solid #2e4150;
        background: #101b26;
        display: flex;
        align-items: center;
        justify-content: space-around;
        gap: 5px;
        padding: 6px 9px;
        flex: 0 0 auto;
        min-height: 52px;
      }
      .mobiletabs button {
        display: flex;
        align-items: center;
        gap: 5px;
        color: #a8b9ca;
        border-radius: 7px;
        padding: 7px;
        font-size: 10px;
      }
      .mobiletabs button.active {
        color: #cde4ff;
        background: #283b50;
      }
      .dropdown {
        position: absolute;
        z-index: 10;
        right: 12px;
        top: 103px;
        border: 1px solid #42556b;
        background: #223243;
        border-radius: 10px;
        box-shadow: 0 18px 36px #0009;
        width: min(310px, calc(100% - 24px));
        padding: 7px;
        max-height: 55vh;
        overflow: auto;
      }
      .dropdown button {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        padding: 10px 9px;
        border-radius: 7px;
        text-align: left;
        color: #d1dfeb;
        font-size: 11px;
      }
      .dropdown button:active {
        background: #374a60;
      }
      .dropdown .item-name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        flex: 1;
      }
      .dropdown .remove {
        margin-left: auto;
        color: #afc0cf;
        display: grid;
        place-items: center;
        padding: 4px;
      }
      .dropdown .selected {
        background: #304862;
      }
      .empty {
        padding: 35px 5px;
        text-align: center;
        color: #a5b7c7;
        line-height: 1.7;
        font-size: 12px;
      }
      .caption {
        font-size: 10px;
        color: #879caa;
        line-height: 1.65;
        margin: 8px 0;
      }
      .bottom-debug {
        height: 44px;
        background: #0b1119;
        border-top: 1px solid #283949;
        display: flex;
        gap: 6px;
        align-items: center;
        padding: 5px 8px;
        flex: 0 0 auto;
      }
      .bottom-debug button {
        border: 1px solid #384a5d;
        border-radius: 6px;
        padding: 7px 10px;
        font-size: 10px;
        color: #b8c8d5;
      }
      .bottom-debug button.selected {
        background: #29445e;
        color: #e1f0ff;
        border-color: #5b7b9d;
      }
      @media (min-width: 480px) {
        body {
          display: flex;
          align-items: center;
          justify-content: center;
          min-height: 100dvh;
          padding: 14px;
        }
        #mobile {
          height: min(880px, calc(100dvh - 28px));
          border-radius: 24px;
          box-shadow: 0 18px 80px #000b;
        }
      }

      /* V2 mobile: no bottom tabs or horizontal section switcher. Native back + header switcher only. */
      .mobiletabs,
      .sectionbar {
        display: none !important;
      }
      .screen {
        border-radius: 19px 19px 0 0;
      }
      .screenhead {
        background: #162331;
      }
      .stackhint {
        padding: 10px 16px;
        background: #1a2a39;
        border-bottom: 1px solid #334654;
        color: #a5bdce;
        font-size: 11px;
        line-height: 1.5;
      }
      .stackhint strong {
        color: #d6e6f3;
        font-weight: 550;
      }

      /* Composer exploration V1 — scoped, provisional; Workspace V2 remains accepted independently */
      .composer-wrap,
      .composerwrap {
        position: relative;
        z-index: 5;
      }
      .cx-attach {
        display: flex;
        gap: 7px;
        padding: 10px 11px 3px;
        flex-wrap: wrap;
        max-height: 126px;
        overflow: auto;
      }
      .cx-attach:empty {
        display: none;
      }
      .cx-asset {
        display: flex;
        align-items: center;
        gap: 7px;
        min-width: 0;
        max-width: 235px;
        padding: 5px 7px;
        border-radius: 7px;
        border: 1px solid #43566b;
        background: #243446;
        color: #d7e5f3;
        font-size: 11px;
      }
      .cx-asset img {
        width: 29px;
        height: 29px;
        object-fit: cover;
        border-radius: 5px;
      }
      .cx-asset .cx-name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .cx-asset .cx-remove {
        border: 0;
        background: transparent;
        color: #9eb2c8;
        font-size: 17px;
        line-height: 1;
        padding: 1px 4px;
      }
      .cx-toolbar {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 5px;
        flex-wrap: wrap;
      }
      .cx-pill,
      .cx-add {
        border: 1px solid transparent;
        border-radius: 7px;
        background: transparent;
        color: #c1d1df;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        white-space: nowrap;
        font-size: 11px;
        padding: 6px 7px;
        min-height: 30px;
      }
      .cx-pill {
        border-color: #384c60;
        background: #253648;
      }
      .cx-pill:hover,
      .cx-add:hover {
        background: #344b62;
      }
      .cx-pill:focus-visible,
      .cx-add:focus-visible,
      .cx-pop button:focus-visible {
        outline: 2px solid #9cbdf1;
        outline-offset: 2px;
      }
      .cx-pill[hidden] {
        display: none;
      }
      .cx-pill[disabled] {
        opacity: 0.57;
        cursor: default;
      }
      .cx-add {
        font-size: 22px;
        font-weight: 400;
        line-height: 1;
        width: 30px;
        border-color: #384c60;
        background: #213143;
      }
      .cx-toolbar .cx-space {
        flex: 1;
        min-width: 4px;
      }
      .cx-toolbar .cx-send {
        margin-left: 1px;
      }
      .cx-toolbar .cx-subtitle {
        color: #9daebf;
        font-size: 10px;
      }
      .cx-hidden {
        display: none !important;
      }
      .cx-pop {
        position: absolute;
        z-index: 80;
        bottom: calc(100% - 6px);
        left: 18px;
        width: min(365px, calc(100% - 36px));
        max-height: min(340px, 50dvh);
        overflow: auto;
        background: #1e2c3b;
        border: 1px solid #4a6075;
        box-shadow: 0 18px 50px #000a;
        border-radius: 12px;
        padding: 7px;
      }
      .cx-pop[hidden] {
        display: none;
      }
      .cx-pop.align-right {
        left: auto;
        right: 18px;
      }
      .cx-pop h4 {
        margin: 7px 9px 6px;
        color: #9eb3c7;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.07em;
        text-transform: uppercase;
      }
      .cx-pop button {
        display: flex;
        align-items: center;
        gap: 9px;

                .map((a) => basic('archive', a.title, a.detail, `detail:artifact:${a.id}`))
                .join('')}</div>`;
            }
            case 'artifact': {
              let a = ARTIFACTS.find((x) => x.id === id) || ARTIFACTS[0];
              return `<div class="content"><div class="label">${a.kind.toUpperCase()} · ${a.date}</div><h2 style="font-size:17px;line-height:1.35">${escapeHTML(a.title)}</h2><div class="focus"><strong>${escapeHTML(a.detail)}</strong><p>Źródło: ${escapeHTML(a.source)}. Powiązany z ${a.tasks.length} zadaniami.</p></div><div class="label">DOWÓD / USTALENIA</div>${a.status === 'rejected' || a.status === 'attention' ? '<div class="alert"><b>Wynik wymaga działania lub ponownej weryfikacji</b>Przed zmianą stanu workflow sprawdź szczegóły i obowiązujący kontrakt.</div>' : '<p class="small muted">Artefakt powstał w konkretnym wykonaniu i posiada źródło oraz zakres.</p>'}<div class="label">ZADANIA</div>${a.tasks.map((task) => basic('list', task, TASKS.find((x) => x.id === task)?.name || '', `detail:task:${task}`)).join('')}<div class="caption">Treść raportu pobierana na żądanie; zachować unikalne artifact ID i rewizję.</div></div>`;
            }
            case 'handover': {
              let h = TRANSITIONS.find((x) => x.id === id) || TRANSITIONS[0];
              return `<div class="content"><div class="label">PRZEKAZANIE · ${h.when}</div><h2 style="font-size:18px">${h.from} → ${h.to}</h2><div class="focus"><strong>${escapeHTML(h.title)}</strong><p>${escapeHTML(h.notes)}</p></div>${[
                ['Źródło', h.from],
                ['Cel', h.to],
                ['Sesja', h.session],
                ['Zadania', h.scope.join(', ')],
              ]
                .map(([k, v]) => `<div class="kv"><span>${k}</span><strong>${v}</strong></div>`)
                .join(
                  '',
                )}<div class="label">ZAKRES</div>${h.scope.map((x) => basic('list', x, 'Powiązane zadanie', `detail:task:${x}`)).join('')}<div class="caption">Przekazanie to kontekst i referencje, nie automatyczne przekazanie writer claim.</div></div>`;
            }
            case 'attempt': {
              let h = HISTORY.find((x) => x.id === id) || HISTORY[0];
              return `<div class="content"><div class="label">ZDARZENIE · ${h.time}</div><h2 style="font-size:17px">${escapeHTML(h.title)}</h2><div class="focus"><strong>${h.status === 'rejected' ? 'Odrzucono' : h.status === 'active' ? 'W toku' : h.status === 'warning' ? 'Wymaga uwagi' : 'Zakończono'}</strong><p>${escapeHTML(h.detail)}</p></div><div class="label">ZAKRES</div>${h.scope.map((x) => basic('list', x, 'Zadanie', `detail:task:${x}`)).join('')}${h.ref ? basic('archive', 'Powiązany artefakt / przekazanie', h.ref, `detail:${h.ref.startsWith('ho-') ? 'handover' : 'artifact'}:${h.ref}`) : ''}<div class="caption">Historia prób / transition wymaga stabilnych step+attempt+result. Historia Turn/Work jest osobną osią.</div></div>`;
            }
            case 'work':
              return `<div class="content"><div class="label">WORK · BIEŻĄCY TURN</div>${[
                ['Odczyt 4 plików', 'completed'],
                ['Przeszukanie repository', 'completed'],
                ['pnpm test', 'active'],
              ]
                .map(([a, b]) => basic('terminal', a, b, 'detail:tool:cmd'))
                .join(
                  '',
                )}<div class="caption">Pogrupowane Work L2. Tap otwiera ToolAction L4.</div></div>`;
            case 'tool':
              return `<div class="content"><div class="label">TOOLACTION · COMMAND</div><div class="code">pnpm test --filter specflow-runtime</div><div class="label">OUTPUT</div><div class="code">Starting...\n122 tests pass\nRecovery test running</div><p class="caption">Raw output jest stronicowany i redagowany przed wyświetleniem.</p></div>`;
            default:
              return '<div class="empty">Brak szczegółów.</div>';
          }
        }
        function render() {
          renderHeader();
          $('#contentBody').innerHTML =
            st.screen === 'conversation'
              ? conversation()
              : st.screen === 'context'
                ? contextBody()
                : mobileDetail();
          $('#contentBody').scrollTop = 0;
          $('#conversationFooter').style.display = st.screen === 'conversation' ? 'block' : 'none';
          $('#live').style.display = st.screen === 'conversation' ? 'flex' : 'none';
          $('#live').innerHTML =
            ico(st.scenario === 'new' ? 'check' : 'bolt', 14) +
            (st.scenario === 'new'
              ? 'Sesja gotowa do pierwszej wiadomości'
              : 'Review · uruchamianie testów');
          $('#composer').placeholder =
            st.scenario === 'new' ? 'Napisz pierwszą wiadomość...' : 'Odpowiedz agentowi...';
          $('#model').textContent = st.scenario === 'new' ? 'Claude Code · Plan' : 'Codex · Agent';
          $('#tabDrop').style.display = st.dropdown ? 'block' : 'none';
          if (st.dropdown) {
            $('#tabDrop').innerHTML =
              `<div style="padding:8px;color:#8fa9bd;font-size:10px">OTWARTE PLIKI · ${st.opened.length}</div>${st.opened.map((i) => `<button data-openfile="${i.kind}:${i.id}">${ico('file', 16)} <span class="item-name">${escapeHTML(i.label)}</span><span class="remove" data-removefile="${i.id}">×</span></button>`).join('')}<button data-nav="context:summary">${ico('context', 16)} <span>Wróć do kontekstu</span></button><div style="border-top:1px solid #40566a;margin:6px 0;padding:7px;color:#93a9bc;font-size:10px">SCENARIUSZ MAKIE­TY</div><button data-action="scenarioLong">Długa sesja ${st.scenario === 'long' ? '✓' : ''}</button><button data-action="scenarioNew">Nowa sesja ${st.scenario === 'new' ? '✓' : ''}</button>`;
          }
        }
        app.addEventListener('click', (e) => {
          let del = e.target.closest('[data-removefile]');
          if (del) {
            e.stopPropagation();
            st.opened = st.opened.filter((x) => x.id !== del.dataset.removefile);
            st.dropdown = false;
            render();
            return;
          }
          let of = e.target.closest('[data-openfile]');
          if (of) {
            let [kind, id] = of.dataset.openfile.split(':');
            let match = st.opened.find((x) => x.id === id);
            st.dropdown = false;
            navScreen(kind, id, match?.label || id);
            return;
          }
          let sec = e.target.closest('[data-section]');
          if (sec) {
            context(sec.dataset.section);
            return;
          }
          let filter = e.target.closest('[data-filter]');
          if (filter) {
            st.filter = filter.dataset.filter;
            st.limit = 28;
            render();
            return;
          }
          let mode = e.target.closest('[data-filemode]');
          if (mode) {
            st.fileMode = mode.dataset.filemode;
            render();
            return;
          }
          let n = e.target.closest('[data-nav]');
          if (n) {
            let val = n.dataset.nav;
            if (val === 'conversation') {
              st.screen = 'conversation';
              st.dropdown = false;
              render();
              return;
            }
            if (val === 'back') {
              back();
              return;
            }
            if (val.startsWith('context:')) {
              context(val.split(':')[1]);
              return;
            }
            if (val.startsWith('detail:')) {
              let [, kind, id] = val.split(':');
              let label =
                kind === 'file'
                  ? (FILES.find((f) => f.id === id)?.path || id).split('/').at(-1)
                  : kind === 'task'
                    ? id
                    : kind === 'artifact'
                      ? ARTIFACTS.find((a) => a.id === id)?.title || id
                      : kind === 'handover'
                        ? TRANSITIONS.find((h) => h.id === id)?.title || 'Przekazanie'
                        : kind === 'attempt'
                          ? HISTORY.find((h) => h.id === id)?.title || 'Zdarzenie'
                          : kind === 'work'
                            ? 'Work'
                            : 'ToolAction';
              navScreen(kind, id, label);
              return;
            }
          }
          let a = e.target.closest('[data-action]');
          if (!a) return;
          switch (a.dataset.action) {
            case 'back':
              if (st.screen === 'conversation') context('summary');
              else back();
              break;
            case 'tabs':
              st.dropdown = !st.dropdown;
              render();
              break;
            case 'menu':
              st.dropdown = !st.dropdown;
              render();
              break;
            case 'scenarioLong':
              switchSession('long');
              break;
            case 'scenarioNew':
              switchSession('new');
              break;
            case 'loadFiles':
              st.limit += 28;
              $('#contentBody').innerHTML = contextBody();
              break;
            case 'loadHistory':
              st.historyLimit += 6;
              $('#contentBody').innerHTML = contextBody();
              break;
            case 'send':
              $('#toast').textContent = 'Makieta — nie wysyła wiadomości.';
              break;
          }
        });
        app.addEventListener('input', (e) => {
          let field = e.target;
          if (field.id === 'mobileFileSearch' || field.id === 'mobileArtifactSearch') {
            let v = field.value,
              position = field.selectionStart,
              scroll = $('#contentBody').scrollTop;
            if (field.id === 'mobileFileSearch') {
              st.query = v;
              st.limit = 28;
            } else st.artifactQuery = v;
            $('#contentBody').innerHTML = contextBody();
            $('#contentBody').scrollTop = scroll;
            let f = $('#' + field.id);
            if (f) {
              f.focus();
              f.setSelectionRange(position, position);
            }
          }
        });
        render();
      })();
    </script>
    <script>
      /* Composer concept demo only. No network upload, permissions, provider execution or send. */
      (function () {
        const root = document.getElementById('cxAttach');
        if (!root) return;
        const host = root.closest('.composer-wrap,.composerwrap');
        const pop = document.getElementById('cxPop');
        const mobile = !!document.getElementById('mobile');
        const demo = {
          provider: 'codex',
          intent: 'agent',
          approval: 'standard',
          model: 'default',
          effort: 'High',
          open: null,
          attachments: [
            { id: 'sample-screenshot', name: 'screen-recovery.png', kind: 'image', demo: true },
          ],
        };
        const CAT = {
          codex: {
            label: 'Codex',
            intents: [
              { id: 'agent', name: 'Agent', desc: 'Działania w ograniczonym workspace.' },
              { id: 'plan', name: 'Plan', desc: 'Przygotuj plan bez zapisu do repo.' },
              {
                id: 'ask',
                name: 'Ask',
                desc: 'Wymaga certyfikacji trybu read-only.',
                disabled: true,
              },
            ],
            approvals: [
              {
                id: 'standard',
                name: 'Kontrolowany',
                desc: 'Natywne on-request + workspace sandbox.',
              },
            ],
            models: [
              { id: 'default', name: 'Domyślny model', efforts: ['Low', 'Medium', 'High'] },
              { id: 'alternate', name: 'Alternatywny', efforts: ['Medium', 'High'] },
            ],
          },
          claude: {
            label: 'Claude Code',
            intents: [
              { id: 'agent', name: 'Agent', desc: 'Praca z dopuszczonymi narzędziami.' },
              { id: 'plan', name: 'Plan', desc: 'Natywny plan bez modyfikacji.' },
              {
                id: 'ask',
                name: 'Ask',
                desc: 'Wymaga osobnej certyfikacji odpowiedzi read-only.',
                disabled: true,
              },
            ],
            approvals: [
              { id: 'manual', name: 'Manual', desc: 'Natywne zapytania o operacje.' },
              {
                id: 'acceptEdits',
                name: 'Accept Edits',
                desc: 'Automatycznie akceptuje edycje, nie wszystkie komendy.',
              },
              {
                id: 'auto',
                name: 'Auto',
                desc: 'Automatyzacja z oceną ryzyka; dostępność zależy od CLI.',
                disabled: true,
              },
              {
                id: 'dontAsk',
                name: "Don't Ask",
                desc: 'Odmowa niedozwolonych operacji; semantyka natywna.',
              },
            ],
            models: [
              { id: 'default', name: 'Model domyślny', efforts: ['Medium', 'High'] },
              { id: 'alternate', name: 'Inny model', efforts: ['Low', 'Medium', 'High'] },
            ],
          },
        };
        const $ = (q) => document.querySelector(q);
        const esc = (x) =>
          String(x).replace(
            /[&<>"']/g,
            (s) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[s],
          );
        function catalogue() {
          return CAT[demo.provider];
        }
        function selection() {
          return catalogue().intents.find((x) => x.id === demo.intent);
        }
        function activePolicy() {
          return (
            catalogue().approvals.find((x) => x.id === demo.approval) || catalogue().approvals[0]
          );
        }
        function model() {
          return catalogue().models.find((x) => x.id === demo.model) || catalogue().models[0];
        }
        function renderToolbar() {
          const isAgent = demo.intent === 'agent';
          $('#cxIntent').textContent = (selection()?.name || 'Agent') + ' ▾';
          const a = $('#cxApproval');
          a.hidden = !isAgent;
          a.textContent = activePolicy().name + (catalogue().approvals.length > 1 ? ' ▾' : '');
          a.disabled = catalogue().approvals.length === 1;
          a.title = a.disabled ? activePolicy().desc : 'Zatwierdzanie operacji (presety providera)';
          $('#cxModel').textContent = model().name + ' · ' + demo.effort + ' ▾';
        }
        function showAttachments() {
          root.innerHTML = demo.attachments
            .map(
              (a) =>
                '<div class="cx-asset">' +
                (a.url
                  ? '<img alt="" src="' + esc(a.url) + '">'
                  : '<span aria-hidden="true">' +
                    (a.kind === 'image' ? '▧' : a.kind === 'ref' ? '⌁' : '▤') +
                    '</span>') +
                '<span class="cx-name" title="' +
                esc(a.name) +
                '">' +
                esc(a.name) +
                '</span><button type="button" class="cx-remove" data-cx="remove" data-id="' +
                esc(a.id) +
                '" aria-label="Usuń ' +
                esc(a.name) +
                '">×</button></div>',
            )
            .join('');
        }
        function menuEntry(title, sub, cmd, value, checked, disabled) {
          return (
            '<button type="button" data-cx="' +
            cmd +
            '" data-value="' +
            esc(value || '') +
            '" ' +
            (disabled ? 'disabled' : '') +
            '><span><strong>' +
            esc(title) +
            '</strong>' +
            (sub ? '<small>' + esc(sub) + '</small>' : '') +
            '</span>' +
            (checked ? '<span class="cx-check">✓</span>' : '') +
            '</button>'
          );
        }
        function close() {
          demo.open = null;
          pop.hidden = true;
        }
        function renderMenu(menu) {
          demo.open = menu;
          pop.hidden = false;
          pop.classList.toggle('align-right', menu === 'model');
          let inner = '';
          if (menu === 'attach') {
            inner = '<h4>Dodaj do wiadomości</h4>';
            if (mobile)
              inner += menuEntry(
                'Zrób zdjęcie',
                'Otwórz aparat, jeśli urządzenie na to pozwala',
                'takeCamera',
                '',
              );
            inner += menuEntry('Wybierz zdjęcia', 'Obrazy z urządzenia', 'pickImage', '');
            inner += menuEntry('Dodaj plik', 'Plik lokalny do przesłania', 'pickFile', '');
            inner += menuEntry(
              mobile ? 'Plik z projektu' : 'Plik z repozytorium',
              'Dodaj referencję do istniejącego pliku',
              'addRepo',
              '',
            );
            inner +=
              '<div class="cx-help">Makieta: pliki pozostają lokalnie w przeglądarce; nic nie jest wysyłane do agenta.</div>';
          } else if (menu === 'intent') {
            inner = '<h4>Tryb pracy · ' + esc(catalogue().label) + '</h4>';
            inner += catalogue()
              .intents.map((x) =>
                menuEntry(x.name, x.desc, 'intent', x.id, x.id === demo.intent, x.disabled),
              )
              .join('');
            inner +=
              '<div class="cx-help">Ask / Plan / Agent są dostępne tylko po potwierdzeniu semantyki i ograniczeń adaptera.</div>';
          } else if (menu === 'approval') {
            inner = '<h4>Polityka operacji · ' + esc(catalogue().label) + '</h4>';
            inner += catalogue()
              .approvals.map((x) =>
                menuEntry(x.name, x.desc, 'approval', x.id, x.id === demo.approval, x.disabled),
              )
              .join('');
            inner +=
              '<div class="cx-help">To nie są decyzje dotyczące zamykania zadań ani akceptacji review w Engine.</div>';
          } else if (menu === 'model') {
            inner = '<h4>Model · ' + esc(catalogue().label) + '</h4>';
            inner += catalogue()
              .models.map((x) =>
                menuEntry(
                  x.name,
                  'Poziomy effort: ' + x.efforts.join(', '),
                  'model',
                  x.id,
                  x.id === demo.model,
                  false,
                ),
              )
              .join('');
            inner += '<h4>Effort</h4><div class="cx-efforts">';
            inner += model()
              .efforts.map(
                (e) =>
                  '<button type="button" data-cx="effort" data-value="' +
                  esc(e) +
                  '" class="' +
                  (demo.effort === e ? 'selected' : '') +
                  '">' +
                  esc(e) +
                  '</button>',
              )
              .join('');
            inner +=
              '</div><div class="cx-help">Nazwy modeli są przykładowe. Docelowo lista pochodzi z katalogu providera i zależy od wersji CLI.</div>';
          }
          pop.innerHTML = inner;
        }
        function addFile(file) {
          if (!file) return;
          const kind = file.type.startsWith('image/') ? 'image' : 'file';
          const url = kind === 'image' ? URL.createObjectURL(file) : undefined;
          demo.attachments.push({
            id: 'local-' + Math.random().toString(36).slice(2),
            name: file.name,
            kind,
            url,
          });
          showAttachments();
          close();
        }
        function onInput(e) {
          Array.from(e.target.files || []).forEach(addFile);
          e.target.value = '';
        }
        function notify() {
          const node = $('#sendFeedback') || $('#toast');
          if (node) node.textContent = 'Makieta: bez wysyłania do agenta.';
        }
        host.addEventListener('click', (e) => {
          const t = e.target.closest('[data-cx]');
          if (!t) return;
          e.stopPropagation();
          const cmd = t.dataset.cx,
            v = t.dataset.value;
          if (cmd === 'open') {
            demo.open === t.dataset.menu ? close() : renderMenu(t.dataset.menu);
            return;
          }
          if (cmd === 'remove') {
            const i = demo.attachments.findIndex((a) => a.id === t.dataset.id);
            if (i >= 0) {
              const [a] = demo.attachments.splice(i, 1);
              if (a.url) URL.revokeObjectURL(a.url);
            }
            showAttachments();
            return;
          }
          if (cmd === 'intent') {
            demo.intent = v;
            if (v === 'plan') demo.approval = 'standard';
            else demo.approval = catalogue().approvals[0].id;
            renderToolbar();
            close();
            return;
          }
          if (cmd === 'approval') {
            demo.approval = v;
            renderToolbar();
            close();
            return;
          }
          if (cmd === 'model') {
            demo.model = v;
            demo.effort = model().efforts.at(-1);
            renderToolbar();
            renderMenu('model');
            return;
          }
          if (cmd === 'effort') {
            demo.effort = v;
            renderToolbar();
            close();
            return;
          }
          if (cmd === 'pickImage') {
            $('#cxImageInput').click();
            close();
            return;
          }
          if (cmd === 'pickFile') {
            $('#cxFileInput').click();
            close();
            return;
          }
          if (cmd === 'takeCamera') {
            $('#cxCameraInput').click();
            close();
            return;
          }
          if (cmd === 'addRepo') {
            demo.attachments.push({
              id: 'repo-' + Math.random().toString(36).slice(2),
              name: 'src/features/recovery.ts',
              kind: 'ref',
            });
            showAttachments();
            close();
            return;
          }
        });
        $('#cxImageInput').addEventListener('change', onInput);
        $('#cxFileInput').addEventListener('change', onInput);
        $('#cxCameraInput').addEventListener('change', onInput);
        document.addEventListener('click', (e) => {
          if (!host.contains(e.target)) close();
        });
        document.addEventListener('keydown', (e) => {
          if (e.key === 'Escape' && demo.open) {
            close();
            e.stopPropagation();
          }
        });
        const hidden = $('#modeLabel') || $('#model');
        function providerChanged() {
          const next = (hidden.textContent || '').includes('Claude') ? 'claude' : 'codex';
          if (next !== demo.provider) {
            demo.provider = next;
            demo.intent = next === 'claude' ? 'plan' : 'agent';
            demo.approval = catalogue().approvals[0].id;
            demo.model = 'default';
            demo.effort = model().efforts.at(-1);
            demo.attachments.forEach((a) => {
              if (a.url) URL.revokeObjectURL(a.url);
            });
            demo.attachments =
              next === 'claude'
                ? []
                : [
                    {
                      id: 'sample-screenshot',
                      name: 'screen-recovery.png',
                      kind: 'image',
                      demo: true,
                    },
                  ];
            showAttachments();
            close();
          }
          renderToolbar();
        }
        new MutationObserver(providerChanged).observe(hidden, {
          childList: true,
          characterData: true,
          subtree: true,
        });
        providerChanged();
        showAttachments();
      })();
    </script>
