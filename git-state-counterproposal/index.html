function treeModel(){let root={children:new Map(),ids:[],key:''};for(const f of files){if(query&&!f.path.toLowerCase().includes(query.toLowerCase()))continue;let cur=root;cur.ids.push(f.id);let parts=f.path.split('/');parts.forEach((name,i)=>{if(!cur.children.has(name))cur.children.set(name,{name,key:(cur.key?cur.key+'/':'')+name,children:new Map(),ids:[],file:i===parts.length-1?f:null});cur=cur.children.get(name);cur.ids.push(f.id);});}return root}
function treeRows(node,depth=0){let children=[...node.children.values()].sort((a,b)=>Number(!!a.file)-Number(!!b.file)||a.name.localeCompare(b.name));return children.map(n=>{let label=n.name;while(!n.file&&n.children.size===1){let next=[...n.children.values()][0];if(next.file)break;label+='/'+next.name;n=next}let folder=!n.file,key=n.key,close=collapsed.has(key)&&!query,ids=n.ids.filter(i=>!files.find(f=>f.id===i)?.locked),locked=!ids.length,checked=ids.length&&ids.every(i=>selected.has(i)),partial=!checked&&ids.some(i=>selected.has(i));let row='<div class="tree-row" style="--depth:'+depth+'">'+(folder?'<button class="toggle" data-action="toggle-folder" data-key="'+esc(key)+'" aria-label="'+(close?'Expand':'Collapse')+' '+esc(label)+'">'+icon(close?'right':'down')+'</button>':'<span style="width:22px;flex:none"></span>')+'<input type="checkbox" aria-label="Select '+esc(label)+'" data-ids="'+ids.join(',')+'" '+(checked?'checked ':'')+(partial?'data-partial="true" ':'')+(locked?'disabled':'')+'>'+icon(folder?(close?'folder':'open'):'file',folder?'folder':'file')+'<button class="label '+(folder?'folder-name':'')+'" title="'+esc(key)+'" data-action="'+(folder?'toggle-folder':'diff')+'" data-key="'+esc(key)+'">'+esc(label)+'</button>'+(folder?'<span class="muted stat">'+n.ids.length+'</span>':n.file.locked?'<span class="muted stat" title="Saving">…</span>':n.file.atomic?'<span class="muted stat" title="Saved together">↔</span>':'')+(!folder?'<span class="stat '+(n.file.status==='A'?'green':n.file.status==='D'?'red':'amber')+'">'+n.file.status+'</span>':'')+'</div>';return row+(folder&&!close?treeRows(n,depth+1):'')}).join('')}
function setSelection(ids,on){let expanded=new Set(ids);for(const i of ids){let group=files.find(f=>f.id===i)?.atomic;if(group)for(const f of files.filter(x=>x.atomic===group&&!x.locked))expanded.add(f.id)}for(const i of expanded)on?selected.add(i):selected.delete(i);if(id()==='20'&&selected.size>200){selected=new Set([...selected].slice(0,200));toast='Select up to 200 files per commit.'}renderTree();renderFoot();}
function renderTree(){let target=$('tree');if(!target)return;let scroll=target.scrollTop;target.innerHTML=treeRows(treeModel())||'<div class="empty">No matching files</div>';target.scrollTop=scroll;let all=$('selectAll');let ids=available();all.checked=ids.length>0&&ids.every(x=>selected.has(x));all.indeterminate=!all.checked&&ids.some(x=>selected.has(x));$('selection').textContent=selected.size+' of '+count()+' selected';target.querySelectorAll('[data-partial]').forEach(x=>x.indeterminate=true)}
function renderFoot(){let foot=$('foot');if(!foot)return;let disabled=!selected.size||pending||busy||id()==='24'&&!cleared||id()==='27'&&!cleared||id()==='31'&&!cleared;let n=selected.size;foot.innerHTML=(mode==='panel'?'<label for="message">Commit message</label><textarea id="message" rows="2" placeholder="Describe the changes">'+esc(message)+'</textarea>'+(id()==='22'?'<span class="muted">This commit will use your Git identity.</span>':''):'')+(!n?'<span class="muted">Select at least one file to continue.</span>':'')+'<div class="actions">'+(mode==='panel'?btn('Discard selected','discard','danger',disabled,'trash')+btn('Cancel','close','ghost end')+btn(pending?'Committing…':'Commit '+n+' '+(n===1?'file':'files'),'commit','primary',disabled||!message.trim()):btn('Cancel','close','ghost end')+btn('Discard '+n+' '+(n===1?'file':'files'),'confirmDiscard','danger solid',disabled))+'</div>';}
function panel(){let isConfirm=mode==='confirm',isDiff=mode==='diff'||mode==='committedDiff',title=isConfirm?'Discard changes?':isDiff?(mode==='committedDiff'?'Committed changes':'File changes'):mode==='discard'?'Discard changes':'Uncommitted changes';let head='<div class="panel-head"><div class="handle"></div><div class="row">'+(isDiff?btn('','back','iconbtn ghost',false,'left'):icon(isConfirm||mode==='discard'?'trash':'diff',isConfirm?'red':''))+'<h3 class="grow">'+title+'</h3>'+(!isDiff&&!isConfirm?'<span class="muted">'+count()+' files</span>':'')+btn('','close','iconbtn ghost',false,'x')+'</div><div class="row muted">'+icon('branch')+'<span class="truncate">nevo-1/single-sign-on</span></div></div>';let body='';if(isConfirm){body='<div class="confirm-body stack">'+notice('This cannot be undone','Discard '+selected.size+' selected '+(selected.size===1?'file':'files')+'? Local changes in these files will be lost.','', 'red')+(id()==='30'?'<p class="muted">The agent attempt remains in history. After discarding, only Reject is available.</p>':'')+'<details><summary class="muted">Review selected files ('+selected.size+')</summary><div class="stack" style="margin-top:10px">'+files.filter(f=>selected.has(f.id)).map(f=>'<div class="muted" style="overflow-wrap:anywhere">'+esc(f.path)+'</div>').join('')+'</div></details></div><div class="panel-foot"><div class="actions">'+btn('Back','backDiscard','secondary end')+btn('Discard '+selected.size+' files','performDiscard','danger solid',!selected.size)+'</div></div>'}else if(isDiff){body='<div class="panel-body"><div class="muted" style="overflow-wrap:anywhere">'+esc(diffPath||'Changes compared with base branch')+'</div><div class="diff"><div>@@ sample diff · illustrative only @@</div><div class="minus">- return previousDestination;</div><div class="plus">+ return validatedDestination;</div><div>  // Continue workflow</div></div></div><div class="panel-foot"><div class="actions">'+btn('Back','back','secondary end')+'</div></div>'}else{let info=!cleared?error||(['18','20','22','23','25'].includes(id())?scenario[3]:''):'';body='<div class="panel-body">'+(info?notice(error?'Action needs attention':id()==='25'?'Commit in progress':id()==='18'?'Saved together':id()==='20'?'Commit size limit':id()==='23'?'Saving files':'Agent work',info,error&&['24','27','31'].includes(id())?btn('Refresh changes','refresh','link',false,'refresh'):error&&id()==='26'?'<details class="muted"><summary>Technical details</summary>Pre-commit hook exited with an error (sample).</details>':'',error?'red':'amber'):'')+'<div class="search">'+icon('search')+'<input id="search" type="search" placeholder="Find files…" aria-label="Find files" value="'+esc(query)+'"></div><div class="tree-toolbar"><input id="selectAll" type="checkbox" aria-label="Select all files"><span class="strong" style="font-size:12px">Select all</span><span class="end muted" id="selection"></span>'+btn('','collapse','iconbtn ghost',false,'fold')+btn('','expand','iconbtn ghost',false,'unfold')+'</div><div id="tree" class="tree"></div></div><div id="foot" class="panel-foot"></div>'}return '<div class="overlay"><section role="dialog" aria-modal="true" aria-label="'+title+'" class="panel">'+head+body+'</section></div>'}
function render(){const app=$('app');app.innerHTML=appShell()+(mode?panel():'')+(toast?'<div class="toast">'+icon('check','green')+esc(toast)+'</div>':'');renderTree();renderFoot();}
function allFolders(n){return [...n.children.values()].flatMap(x=>x.file?[]:[x.key,...allFolders(x)])}
function finish(discard){let n=selected.size;files=files.filter(f=>!selected.has(f.id));selected=new Set(available());mode='';error='';cleared=true;pending=false;if(['07','22','30','05'].includes(id()))agentResolution=discard?'discard':'commit';toast=(discard?'Discarded ':'Committed ')+n+' '+(n===1?'file':'files')+(discard?'':' · a81c9e2');render()}
let priorMode='panel';$('app').addEventListener('click',e=>{let b=e.target.closest('button[data-action]');if(!b||b.disabled)return;let a=b.dataset.action;if(a==='toggle-folder'){let k=b.dataset.key;collapsed.has(k)?collapsed.delete(k):collapsed.add(k);renderTree();return}if(a==='diff'){priorMode=mode;diffPath=b.dataset.key;mode='diff';render();return}if(a==='collapse'){collapsed=new Set(allFolders(treeModel()));renderTree();return}if(a==='expand'){collapsed.clear();renderTree();return}if(a==='review'){mode='panel';query='';}else if(a==='close'){mode='';}else if(a==='discard'){mode='discard';}else if(a==='confirmDiscard'){mode='confirm';}else if(a==='backDiscard'){mode='discard';}else if(a==='performDiscard'){finish(true);return}else if(a==='commit'){if(!message.trim()||!selected.size)return;finish(false);return}else if(a==='refresh'){cleared=true;error='';pending=false;files.forEach(f=>f.locked=false);selected=new Set(available().slice(0,id()==='20'?200:Infinity));toast='Repository state refreshed';}else if(a==='committedDiff'){priorMode='';mode='committedDiff';diffPath='';}else if(a==='back'){mode=priorMode;diffPath='';}else if(a==='retry'){mode='panel';error='';toast='Retry preview · review changes before committing';}else if(a==='pr'){toast='Linked PR #42 · sample only';}else if(a==='run'||a==='confirmStep'||a==='rejectStep'){toast='Workflow action · sample only';}render()});
$('app').addEventListener('change',e=>{if(e.target.id==='selectAll')setSelection(available(),e.target.checked);else if(e.target.dataset.ids)setSelection(e.target.dataset.ids.split(',').filter(Boolean).map(Number),e.target.checked)});
$('app').addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;renderTree()}else if(e.target.id==='message'){message=e.target.value;let button=$('foot').querySelector('[data-action="commit"]');if(button)button.disabled=!message.trim()||!selected.size||pending||(['24','27','31'].includes(id())&&!cleared)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&mode){mode='';render()}});
$('scenario').innerHTML=scenarios.map(s=>'<option value="'+s[0]+'">'+s[0]+' · '+esc(s[1])+'</option>').join('');
$('scenario').addEventListener('change',e=>changeScenario(e.target.value));
function setViewport(v){viewport=v;$('stage').className='stage '+v;$('desktop').classList.toggle('active',v==='desktop');$('phone').classList.toggle('active',v==='phone')}
$('desktop').onclick=()=>setViewport('desktop');$('phone').onclick=()=>setViewport('phone');$('reset').onclick=()=>init(id());window.addEventListener('hashchange',()=>init(location.hash.slice(1)));setViewport('desktop');init(location.hash.slice(1)||'01');
</script></body></html>
