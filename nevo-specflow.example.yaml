# Copy this file to nevo-specflow.yaml and adjust it for the project.
# Workstation-local secrets and overrides belong in .nevo-local/nevo-specflow.yaml.

server:
  host: 127.0.0.1
  port: 4318
  # Required for OIDC callbacks. Its protocol must match Runtime TLS.
  # Reverse-proxy TLS termination is not supported by this foundation.
  # publicOrigin: https://specflow.example.test:4318
  tls:
    enabled: false
    # certFile: .nevo-local/tls/cert.pem
    # keyFile: .nevo-local/tls/key.pem

auth:
  mode: none
  # Optional attribution identity for trusted/no-login mode.
  # localUserId: demo-user
  users:
    demo-user:
      name: Demo User
  providers:
    password:
      enabled: false
    oidc:
      enabled: false

authorization:
  # Project-owned role assignments. User ids must exist in project auth.users.
  assignments:
    - userId: demo-user
      role: admin
      scope: {}
