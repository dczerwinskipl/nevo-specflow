# Example committed project configuration.
# nevo-specflow init writes this shape to .nevo/config.yaml.
# Top-level sections are product composition namespaces owned by their capabilities.

runtime:
  server:
    host: 127.0.0.1
    port: 4318
    # Required when at least one OIDC instance is enabled.
    # A non-loopback required-auth Runtime must terminate TLS itself.
    # Browser-facing SpecFlow product origin used for OIDC callbacks and redirects.
    # Normal `nevo-specflow start` serves both UI and /api on this origin.
    # publicOrigin: http://127.0.0.1:4318
    # UI-only Vite development may use http://127.0.0.1:5173 with /api proxied to 4318;
    # that is a development override, not the normal generated/product topology.
    tls:
      enabled: false

  authentication:
    mode: none
    users:
      demo-user:
        name: Demo User
      # OIDC identities use the normalized allowed email as their stable id.
      # The active session display name comes from OIDC claims.
      developer@example.com:
        name: developer@example.com
    providers:
      password:
        enabled: false
      oidc:
        instances: {}

        # Example:
        # instances:
        #   company:
        #     name: Company SSO
        #     enabled: true
        #     issuer: https://issuer.example.com
        #     clientId: specflow-client
        #     allowedEmails:
        #       developer@example.com: developer@example.com

  authorization:
    assignments:
      - userId: demo-user
        role: admin
        scope: {}
      - userId: developer@example.com
        role: developer
        scope: {}
