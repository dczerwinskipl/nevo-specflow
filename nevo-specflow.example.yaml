# Example committed project configuration.
# nevo-specflow init writes this shape to .nevo/config.yaml.
# Top-level sections are product composition namespaces owned by their capabilities.

runtime:
  server:
    host: 127.0.0.1
    port: 4318
    # Required when at least one OIDC instance is enabled.
    # A non-loopback required-auth Runtime must terminate TLS itself.
    # publicOrigin: http://127.0.0.1:4318
    tls:
      enabled: false

  auth:
    mode: none
    users:
      demo-user:
        name: Demo User
    providers:
      password:
        enabled: false
      oidc:
        instances: {}

        # Example:
        # instances:
        #   company:
        #     name: Company SSO
        #     enabled: true
        #     issuer: https://issuer.example.com
        #     clientId: specflow-client
        #     allowedEmails:
        #       developer@example.com: demo-user

  authorization:
    assignments:
      - userId: demo-user
        role: admin
        scope: {}
