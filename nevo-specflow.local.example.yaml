# Example workstation-local override.
# Copy to .nevo-local/nevo-specflow.yaml. This example contains only fake values.

server:
  publicOrigin: https://specflow.example.test:4318
  tls:
    enabled: true
    certFile: .nevo-local/tls/cert.pem
    keyFile: .nevo-local/tls/key.pem

auth:
  mode: required
  providers:
    password:
      enabled: true
      accounts:
        demo:
          userId: demo-user
          passwordHash: "<replace-with-a-local-password-hash>"
    # Google example. Current profile: confidential OIDC client using client_secret_post.
    oidc:
      enabled: true
      issuer: https://accounts.google.com
      clientId: example.apps.googleusercontent.com
      clientSecret: "<replace-with-a-local-client-secret>"
      allowedEmails:
        demo@example.com: demo-user
