# Example workstation-local configuration.
# nevo-specflow init writes .nevo/local/config.yaml and ensures .nevo/local/ is ignored.
# This example contains only fake values. Project policy/provider enablement stays committed.

auth:
  # For auth.mode=none, select the workstation attribution identity here.
  # localUserId: local-user

  providers:
    password:
      accounts:
        demo:
          userId: demo
          # Generated automatically by `nevo-specflow init` for password auth.
          passwordHash: "<replace-with-a-local-password-hash>"

    oidc:
      # OIDC issuer/clientId/allowedEmails belong in .nevo/config.yaml.
      clientSecret: "<replace-with-a-local-client-secret>"
