kind: specification-archetype
schemaVersion: 1
id: architecture
version: 1
title: Architecture
description: "A structural change or design question: an architecture analysis plus recorded decisions, suggested and preselected."
useWhen: The work reshapes modules, ownership or dependencies, or answers a design question without a user-facing change.
instructions: Start with the overview, state the problem in the architecture document, record each decision in decisions as it is made and use research for evidence. Do not describe user-facing behaviour here; link to a feature Specification if one exists.
requirements:
  - documentType: overview
    minCount: 1
templates:
  - id: overview
    documentType: overview
    filename: overview.md
    include: always
    instructions: Fill Context and Goal first; leave a section empty rather than inventing content.
    contentFile: templates/overview.md
  - id: architecture
    documentType: architecture
    filename: architecture.md
    include: optional
    preselected: true
    instructions: Give at least two options with trade-offs before the chosen structure.
    content: |
      # {{specificationTitle}} - Architecture

      ## Context

      ## Options considered

      ## Chosen structure

      ## Constraints
  - id: decisions
    documentType: decisions
    filename: decisions.md
    include: optional
    preselected: true
    instructions: Add one section block per decision; do not rewrite earlier decisions, supersede them.
    content: |
      # {{specificationTitle}} - Decisions

      ## Context

      ## Options

      ## Decision

      ## Consequences
  - id: research
    documentType: research
    filename: research.md
    include: optional
    instructions: List the questions first; every finding cites a source.
    content: |
      # {{specificationTitle}} - Research

      ## Questions

      ## Sources

      ## Findings
  - id: note
    documentType: note
    filename: note.md
    include: optional
    instructions: State why this note belongs here.
    content: |
      # {{specificationTitle}} - Note
