kind: workflow
schemaVersion: 1
id: specification-standard
version: 1
title: Standard Specification
description: Requirements with the owner, Specification, solution design, breakdown with review, Task creation, then waiting for the Tasks and owner acceptance.
subject: specification
entryStep: requirements
steps:
  - id: requirements
    kind: work
    title: Gather requirements
    executor: agent
    archetype: spec-writer
    interaction: interactive
    purpose: Agree on the goal, scope, constraints and acceptance with the owner in conversation.
    transitions:
      - id: agreed
        label: Requirements agreed
        to: { step: specification }
        continuation: auto
        session: reuse
  - id: specification
    kind: work
    title: Write the Specification
    executor: agent
    archetype: spec-writer
    purpose: Write the Specification documents from the agreed requirements.
    transitions:
      - id: written
        to: { step: solution }
        continuation: auto
  - id: solution
    kind: work
    title: Design the solution
    executor: agent
    archetype: solution-designer
    purpose: Design the solution and record its decisions.
    transitions:
      - id: designed
        to: { step: breakdown }
        continuation: auto
  - id: breakdown
    kind: work
    title: Break the solution down
    executor: agent
    archetype: task-planner
    purpose: Propose the Tasks, each with its task type, dependencies and verification.
    transitions:
      - id: proposed
        to: { step: breakdown-review }
        continuation: auto
  - id: breakdown-review
    kind: work
    title: Review the breakdown
    executor: agent
    archetype: reviewer
    purpose: Check that the Specification, the solution and the proposed Tasks are complete and consistent.
    transitions:
      - id: approved
        result: pass
        to: { step: create-tasks }
        continuation: auto
      - id: changes-requested
        result: fail
        to: { step: breakdown }
        feedback: required
        continuation: auto
  - id: create-tasks
    kind: work
    title: Create the Tasks
    executor: agent
    archetype: task-planner
    purpose: Create the reviewed Tasks; the finish input lists them with their task types.
    produces: tasks
    transitions:
      - id: created
        to: { step: implementation }
        effects: [unblock-tasks]
  - id: implementation
    kind: wait-for-tasks
    title: Implementation
    purpose: Wait until every Task is finished.
    transitions:
      - id: tasks-finished
        to: { step: acceptance }
  - id: acceptance
    kind: work
    title: Acceptance
    executor: human
    purpose: The owner accepts the implemented Specification.
    transitions:
      - id: accepted
        to: { terminal: completed }
returns:
  - step: requirements
    label: Back to requirements
    effects: [block-pending-tasks]
  - step: specification
    label: Back to the Specification
    effects: [block-pending-tasks]
  - step: solution
    label: Back to the solution
    effects: [block-pending-tasks]
  - step: breakdown
    label: Add or change Tasks
    effects: [block-pending-tasks]
