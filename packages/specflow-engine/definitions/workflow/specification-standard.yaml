kind: workflow
schemaVersion: 1
id: specification-standard
version: 1
title: Standard Specification
description: Requirements with the owner, Specification, solution design, a breakdown into draft Tasks with a review that approves them, then waiting for the Tasks and owner acceptance.
subject: specification
entryStep: requirements
steps:
  - id: requirements
    kind: work
    title: Gather requirements
    executors: [agent, human]
    archetype: spec-writer
    interaction: interactive
    purpose: A shared, owner-confirmed picture of the goal, scope and acceptance.
    transitions:
      - id: agreed
        label: Requirements agreed
        to: { step: specification }
        continuation: auto
        session: reuse
  - id: specification
    kind: work
    title: Write the Specification
    executors: [agent, human]
    archetype: spec-writer
    purpose: Documents that state what to build and how to tell it is done.
    transitions:
      - id: written
        label: Specification written
        to: { step: solution }
        continuation: auto
  - id: solution
    kind: work
    title: Design the solution
    executors: [agent, human]
    archetype: solution-designer
    purpose: A chosen approach, with its trade-offs and decisions written down.
    transitions:
      - id: designed
        label: Solution designed
        to: { step: breakdown }
        continuation: auto
  - id: breakdown
    kind: work
    title: Break the solution down
    executors: [agent, human]
    archetype: task-planner
    purpose: Draft Tasks that together cover the solution, each one verifiable.
    produces: tasks
    transitions:
      - id: proposed
        label: Breakdown proposed
        to: { step: breakdown-review }
        continuation: auto
  - id: breakdown-review
    kind: work
    title: Review the breakdown
    executors: [agent, human]
    archetype: reviewer
    purpose: No gaps or conflicts between the Specification, solution and Tasks.
    transitions:
      - id: approved
        label: Breakdown approved
        result: pass
        to: { step: implementation }
        effects: [approve-draft-tasks]
      - id: changes-requested
        label: Changes requested
        result: fail
        to: { step: breakdown }
        feedback: required
        continuation: auto
  - id: implementation
    kind: wait-for-tasks
    title: Waiting for Tasks
    purpose: The Specification is built, Task by Task.
    transitions:
      - id: tasks-finished
        label: All Tasks finished
        on: tasks-finished
        to: { step: acceptance }
      - id: task-escalated
        on: task-escalated
        label: A Task needs a Specification change
        to: { step: breakdown }
        feedback: required
        continuation: owner-action
  - id: acceptance
    kind: work
    title: Acceptance
    executors: [human]
    purpose: Confirmation that the delivered work does what the owner asked for.
    transitions:
      - id: accepted
        label: Specification accepted
        to: { terminal: completed }
returns:
  - step: requirements
    label: Back to requirements
  - step: specification
    label: Back to the Specification
  - step: solution
    label: Back to the solution
  - step: breakdown
    label: Add or change Tasks
