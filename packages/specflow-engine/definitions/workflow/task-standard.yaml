kind: workflow
schemaVersion: 1
id: task-standard
version: 1
title: Standard Task
description: Implement the Task, then an independent review; a rejected review goes back to implementation with its feedback.
subject: task
entryStep: implement
steps:
  - id: implement
    kind: work
    title: Implement
    executors: [agent, human]
    archetype: implementer
    purpose: The Task's change works, stays in scope and passes its verification.
    transitions:
      - id: implemented
        label: Implemented
        to: { step: review }
        continuation: auto
  - id: review
    kind: work
    title: Review
    executors: [agent, human]
    archetype: reviewer
    purpose: The change is confirmed correct, in scope and within repository rules.
    transitions:
      - id: approved
        label: Approved
        result: pass
        to: { terminal: completed }
      - id: changes-requested
        label: Changes requested
        result: fail
        to: { step: implement }
        feedback: required
        continuation: auto
      - id: escalated
        result: needs-spec-change
        label: The Specification needs a change
        to: { step: implement }
        feedback: required
        escalate: true
returns:
  - step: implement
    label: Back to implementation
