kind: workflow
schemaVersion: 1
id: task-ui
version: 1
title: UI Task
description: Implement the UI Task from its UX contract, then an independent review; a rejected review goes back to implementation.
subject: task
entryStep: implement
steps:
  - id: implement
    kind: work
    title: Implement
    executors: [agent, human]
    archetype: implementer-ui
    purpose: The screens match their UX contract and pass the Task's verification.
    transitions:
      - id: implemented
        label: Implemented
        to: { step: review }
        continuation: auto
  - id: review
    kind: work
    title: Review
    executors: [agent, human]
    archetype: reviewer
    purpose: The UI is confirmed to match its UX contract and the design system.
    transitions:
      - id: approved
        label: Approved
        result: pass
        to: { terminal: completed }
      - id: changes-requested
        label: Changes requested
        result: fail
        to: { step: implement }
        feedback: required
        continuation: auto
      - id: escalated
        result: needs-spec-change
        label: The Specification needs a change
        to: { step: implement }
        feedback: required
        escalate: true
returns:
  - step: implement
    label: Back to implementation
