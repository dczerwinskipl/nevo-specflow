# pnpm workspace + project settings.
#
# Since pnpm 10, only auth/registry settings are read from .npmrc; every other
# project setting lives here.

packages:
  - "apps/*"
  - "packages/*"
  - "tools/*"
  # packages/  -> source boundaries that compose the SpecFlow product plus reusable
  #              neutral Nevo capabilities; the future SpecFlow UI belongs here too.
  # apps/      -> optional independently deployed/operated hosts; currently empty.
  # tools/     -> repository-internal tooling (docs, agents, release, github, figma-project).

# Resolve dependencies and check `engines` against the pinned Node, regardless
# of which Node the developer is currently running. Keep in sync with .nvmrc.
nodeVersion: "24.20.0"
engineStrict: true

# Pin exact versions on `pnpm add` so every dependency change is an explicit,
# reviewable diff.
savePrefix: ""

# The only third-party package allowed to run an install script: esbuild fetches
# its platform binary in a postinstall. It is used by package-owned product
# artifact bundling for the distributable `nevo-specflow` CLI.
onlyBuiltDependencies:
  - esbuild
