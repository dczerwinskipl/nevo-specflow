# Retrieval eval of documentation discovery for this repository (`pnpm docs:eval`; manual, not in
# CI). Realistic agent questions, English and Polish (`lang`), each with the 1..3 active,
# authoritative document ids a good answer must return. Keep `expected` to documents that really
# answer the question; add a question when a search regression is found. Questions the
# documentation does not answer have `expected: []`: they are not scored for recall; one that gets
# a document found by meaning only (`wordMatch: false`) is a false positive.
#
# `class` says what a question tests: `correct` (default with `expected`), `partial` (a word cut
# short), `typo` (misspelled words), `negative` (default without `expected`: a real question the
# documentation does not answer) and `random` (a string that means nothing; `lang` optional).
# `pnpm docs:eval --random <count>` adds generated random strings, which are much harder than the
# hand-written ones below.

questions:
